const GEMIST=[
  {label:"Trekstoot",emoji:"↩️"},{label:"Direct",emoji:"➤"},

  {label:"Direct",emoji:"➤"},{label:"Driebanden",emoji:"🔺"},
  {label:"Bandstoot",emoji:"💢"},{label:"Snijden",emoji:"✂️"},
  {label:"Dun",emoji:"🪶"},{label:"Amorti",emoji:"🪃"},
  {label:"Massé",emoji:"🌀"},{label:"Piqué",emoji:"🎯"},
  {label:"Doorstoot",emoji:"➡️"},{label:"Acquit",emoji:"🎬"},
];

const SK="biljart-tracker-v2";

function stat(beurten){
  if(!beurten||!beurten.length)return null;
  const cars=beurten.map(b=>b.caramboles);
  const totCar=cars.reduce((a,b)=>a+b,0);
  const mx=Math.max(...cars);
  const poedels=beurten.filter(b=>b.caramboles===0).length;
  const gemPerBeurt=(totCar/beurten.length).toFixed(2);
  const opbouw5=beurten.filter(b=>b.caramboles>=5).length;
  const opbouw57=beurten.filter(b=>b.caramboles>=5&&b.caramboles<=7).length;
  const opbouw89=beurten.filter(b=>b.caramboles>=8&&b.caramboles<=9).length;
  const opbouw10=beurten.filter(b=>b.caramboles>=10).length;
  return{totCar,max:mx,aantalBeurten:beurten.length,poedels,gemPerBeurt,opbouw5,opbouw57,opbouw89,opbouw10};
}

// Berekent chronologisch (oud->nieuw) welke prestatie-badges elke partij heeft verdiend.
// "Record"-achtige badges vergelijken tegen de staat VOOR die partij, niet achteraf.
// Retourneert een array in dezelfde volgorde als partijen: [{id,badges:[{label,emoji,aantal,punten}],punten}]
function berekenPrestaties(partijen,tijdsvensterMaanden){
  let allTimeMaxBeurt=0;
  const verwerkt=[];
  const resultaten=[];

  function vensterSlice(datum){
    if(!tijdsvensterMaanden)return verwerkt;
    const cutoff=new Date(datum);
    cutoff.setMonth(cutoff.getMonth()-tijdsvensterMaanden);
    return verwerkt.filter(function(w){return new Date(w.datum)>=cutoff;});
  }

  (partijen||[]).forEach(function(p){
    const st=stat(p.beurten);
    if(!st){resultaten.push({id:p.id,badges:[],punten:0});return;}
    const gem=parseFloat(st.gemPerBeurt);
    const badges=[];

    if(st.opbouw57>0){
      const waarden=p.beurten.filter(function(b){return b.caramboles>=5&&b.caramboles<=7;}).map(function(b){return b.caramboles;});
      badges.push({label:"Opbouw",emoji:"🎯",aantal:st.opbouw57,punten:st.opbouw57*10,categorie:"Beurt-pieken",detail:"Beurten van "+waarden.join(", ")+" car (drempel: 5-7 car per beurt)"});
    }
    if(st.opbouw89>0){
      const waarden=p.beurten.filter(function(b){return b.caramboles>=8&&b.caramboles<=9;}).map(function(b){return b.caramboles;});
      badges.push({label:"Sterke serie",emoji:"🔥",aantal:st.opbouw89,punten:st.opbouw89*20,categorie:"Beurt-pieken",detail:"Beurten van "+waarden.join(", ")+" car (drempel: 8-9 car per beurt)"});
    }
    if(st.opbouw10>0){
      const waarden=p.beurten.filter(function(b){return b.caramboles>=10;}).map(function(b){return b.caramboles;});
      badges.push({label:"Topserie",emoji:"💫",aantal:st.opbouw10,punten:st.opbouw10*35,categorie:"Beurt-pieken",detail:"Beurten van "+waarden.join(", ")+" car (drempel: 10+ car per beurt)"});
    }

    if(st.max>allTimeMaxBeurt&&allTimeMaxBeurt>0){
      badges.push({label:"Nieuw record beurt",emoji:"🏆",aantal:1,punten:50,categorie:"Beurt-pieken",detail:"Nieuwe hoogste beurt: "+st.max+" car (vorig record: "+allTimeMaxBeurt+" car)"});
    }

    let langsteReeks=0,huidigeReeks=0;
    p.beurten.forEach(function(b){
      if(b.caramboles>0){huidigeReeks++;langsteReeks=Math.max(langsteReeks,huidigeReeks);}
      else huidigeReeks=0;
    });
    if(st.poedels===0){
      badges.push({label:"Geen poedel hele partij",emoji:"🛡️",aantal:1,punten:30,categorie:"Consistentie",detail:"0 van de "+st.aantalBeurten+" beurten was een poedel"});
    }else if(langsteReeks>=8){
      badges.push({label:"Lange reeks zonder poedel",emoji:"⛓️",aantal:1,punten:25,categorie:"Consistentie",detail:"Langste reeks: "+langsteReeks+" beurten op rij zonder poedel (drempel: 8+)"});
    }else if(langsteReeks>=5){
      badges.push({label:"Reeks zonder poedel",emoji:"⛓️",aantal:1,punten:15,categorie:"Consistentie",detail:"Langste reeks: "+langsteReeks+" beurten op rij zonder poedel (drempel: 5+)"});
    }
    const poedelPct=st.poedels/st.aantalBeurten*100;
    if(poedelPct<20&&st.poedels>0){
      badges.push({label:"Weinig poedels",emoji:"✅",aantal:1,punten:15,categorie:"Consistentie",detail:st.poedels+" van de "+st.aantalBeurten+" beurten poedel ("+Math.round(poedelPct)+"%, drempel: <20%)"});
    }

    const herstelDetails=[];
    p.beurten.forEach(function(b,i){
      if(b.caramboles===0){
        const next=p.beurten[i+1];
        if(next&&next.caramboles>=5)herstelDetails.push("na poedel volgde "+next.caramboles+" car");
      }
    });
    if(herstelDetails.length>0)badges.push({label:"Sterk herstel na poedel",emoji:"💪",aantal:herstelDetails.length,punten:herstelDetails.length*15,categorie:"Mentaliteit",detail:herstelDetails.join(" · ")+" (drempel: 5+ car direct na een poedel)"});

    const venster=vensterSlice(p.datum);
    const vensterCar=venster.reduce(function(a,w){return a+w.tot;},0);
    const vensterBeurt=venster.reduce(function(a,w){return a+w.n;},0);
    const totaalGemTotDan=vensterBeurt>0?vensterCar/vensterBeurt:null;
    const vensterLabel=tijdsvensterMaanden?" (laatste "+tijdsvensterMaanden+" mnd)":" ooit";

    const helft=Math.floor(p.beurten.length/2);
    if(helft>=3){
      const eerste=p.beurten.slice(0,helft),tweede=p.beurten.slice(helft);
      const gemE=eerste.reduce(function(a,b){return a+b.caramboles;},0)/eerste.length;
      const gemT=tweede.reduce(function(a,b){return a+b.caramboles;},0)/tweede.length;
      if(gemT>gemE&&totaalGemTotDan!==null&&gem>totaalGemTotDan){
        badges.push({label:"Sterke afsluiting",emoji:"📈",aantal:1,punten:15,categorie:"Mentaliteit",detail:"1e helft: "+gemE.toFixed(2)+" · 2e helft: "+gemT.toFixed(2)+" · partijgemiddelde "+gem.toFixed(2)+" boven totaalgemiddelde"+vensterLabel+" "+totaalGemTotDan.toFixed(2)});
      }
    }

    const basis=totaalGemTotDan!==null?totaalGemTotDan:0;
    const drempel1=Math.floor(basis/0.5)*0.5+0.5;
    const drempel2=drempel1+0.5;
    if(gem>=drempel2){
      badges.push({label:"Gemiddelde boven "+drempel2.toFixed(1).replace(".",","),emoji:"⭐",aantal:1,punten:30,categorie:"Doel & totaal",detail:"Partijgemiddelde: "+gem.toFixed(2)+" (persoonlijke drempel: "+drempel2.toFixed(2)+", op basis van je totaalgemiddelde"+vensterLabel+" "+basis.toFixed(2)+")"});
    }else if(gem>=drempel1){
      badges.push({label:"Gemiddelde boven "+drempel1.toFixed(1).replace(".",","),emoji:"⭐",aantal:1,punten:15,categorie:"Doel & totaal",detail:"Partijgemiddelde: "+gem.toFixed(2)+" (persoonlijke drempel: "+drempel1.toFixed(2)+", op basis van je totaalgemiddelde"+vensterLabel+" "+basis.toFixed(2)+")"});
    }

    const vensterBestGem=verwerkt.length?Math.max.apply(null,verwerkt.map(function(w){return w.gem;})):0;
    if(gem>vensterBestGem&&vensterBestGem>0){
      badges.push({label:"Nieuw beste gemiddelde ooit",emoji:"👑",aantal:1,punten:60,categorie:"Doel & totaal",detail:"Nieuw record: "+gem.toFixed(2)+" (vorig record ooit: "+vensterBestGem.toFixed(2)+")"});
    }

    const tafelKey=p.tafel||"230";
    const vensterTafel=verwerkt.filter(function(w){return w.tafel===tafelKey;});
    const vensterTafelBest=vensterTafel.length?Math.max.apply(null,vensterTafel.map(function(w){return w.gem;})):0;
    if(gem>vensterTafelBest&&vensterTafelBest>0){
      badges.push({label:"Beste partij ooit op deze tafel",emoji:"🏓",aantal:1,punten:40,categorie:"Tafel-specifiek",detail:"Nieuw record op "+tafelLabel(tafelKey)+"-tafel: "+gem.toFixed(2)+" (vorig: "+vensterTafelBest.toFixed(2)+")"});
    }

    if(totaalGemTotDan!==null){
      if(gem>totaalGemTotDan)badges.push({label:"Beter dan je totaalgemiddelde",emoji:"📊",aantal:1,punten:10,categorie:"Vergelijking",detail:"Deze partij: "+gem.toFixed(2)+" vs totaalgemiddelde"+vensterLabel+" "+totaalGemTotDan.toFixed(2)});
    }
    const laatste5=verwerkt.slice(-5);
    if(laatste5.length>=5){
      const rC=laatste5.reduce(function(a,r){return a+r.tot;},0),rN=laatste5.reduce(function(a,r){return a+r.n;},0);
      const rollingGem=rC/rN;
      if(gem>rollingGem)badges.push({label:"Beter dan je 5-partij rolling gemiddelde",emoji:"📉",aantal:1,punten:15,categorie:"Vergelijking",detail:"Deze partij: "+gem.toFixed(2)+" vs 5-partij rolling: "+rollingGem.toFixed(2)});
    }

    const totaalPunten=badges.reduce(function(a,b){return a+b.punten;},0);
    resultaten.push({id:p.id,badges:badges,punten:totaalPunten});

    allTimeMaxBeurt=Math.max(allTimeMaxBeurt,st.max);
    verwerkt.push({datum:p.datum,tot:st.totCar,n:st.aantalBeurten,gem:gem,tafel:tafelKey});
  });

  return resultaten;
}

// Geeft de "records om te verslaan" op basis van alle AFGESLOTEN partijen — gebruikt tijdens het
// live spelen om te checken of een nieuwe beurt/partij een record aan het breken is.
function berekenLopendeRecords(partijen,tijdsvensterMaanden){
  let allTimeMaxBeurt=0;
  const verwerkt=[];
  (partijen||[]).forEach(function(p){
    const st=stat(p.beurten);
    if(!st)return;
    const gem=parseFloat(st.gemPerBeurt);
    const tafelKey=p.tafel||"230";
    allTimeMaxBeurt=Math.max(allTimeMaxBeurt,st.max);
    verwerkt.push({datum:p.datum,tot:st.totCar,n:st.aantalBeurten,gem:gem,tafel:tafelKey});
  });
  let venster=verwerkt;
  if(tijdsvensterMaanden){
    const cutoff=new Date();
    cutoff.setMonth(cutoff.getMonth()-tijdsvensterMaanden);
    venster=verwerkt.filter(function(w){return new Date(w.datum)>=cutoff;});
  }
  const allTimeBestGem=verwerkt.length?Math.max.apply(null,verwerkt.map(function(w){return w.gem;})):0;
  const tafelBest={};
  verwerkt.forEach(function(w){tafelBest[w.tafel]=Math.max(tafelBest[w.tafel]||0,w.gem);});
  const laatste5=verwerkt.slice(-5);
  const rolling5p=laatste5.length>=5?(laatste5.reduce(function(a,r){return a+r.tot;},0)/laatste5.reduce(function(a,r){return a+r.n;},0)):null;
  const vensterCar=venster.reduce(function(a,w){return a+w.tot;},0);
  const vensterBeurt=venster.reduce(function(a,w){return a+w.n;},0);
  const totaalGem=vensterBeurt>0?vensterCar/vensterBeurt:null;
  return{allTimeMaxBeurt:allTimeMaxBeurt,allTimeBestGem:allTimeBestGem,tafelBest:tafelBest,totaalGem:totaalGem,rolling5p:rolling5p,vensterPartijen:venster.length,vensterBeurten:vensterBeurt};
}

// Vult tafelmaat aan voor partijen die dit veld nog niet hebben (oude data van vóór deze functie).
// Regel: 25 beurten -> 2,10-tafel, alle overige -> 2,30-tafel.
// Correctie: de partij met 40 beurten was ook op de 2,10-tafel.
function migreerTafels(d){
  let changed=false;
  (d.partijen||[]).forEach(function(p){
    if(!p.tafel){
      p.tafel=(p.beurten&&p.beurten.length===25)?"210":"230";
      changed=true;
    }
    if(p.beurten&&p.beurten.length===40&&p.tafel!=="210"){
      p.tafel="210";
      changed=true;
    }
  });
  return changed;
}

async function laadData(){
  // Eerst localStorage
  try{
    const s=localStorage.getItem(SK);
    if(s){
      const d=JSON.parse(s);
      if(d&&d.partijen&&d.partijen.length>0){
        console.log("Geladen uit localStorage: "+d.partijen.length+" partijen");
        let changed=migreerTafels(d);
        if(d.onboardingGezien===undefined){d.onboardingGezien=true;changed=true;}
        if(changed)await slaOp(d);
        return d;
      }
    }
  }catch(e){console.log("localStorage fout:",e);}
  // Dan window.storage (Claude app)
  try{
    if(window.storage){
      const r=await window.storage.get(SK);
      if(r){
        const d=JSON.parse(r.value);
        if(d&&d.partijen&&d.partijen.length>0){
          console.log("Geladen uit window.storage: "+d.partijen.length+" partijen");
          let changed=migreerTafels(d);
          if(d.onboardingGezien===undefined){d.onboardingGezien=true;changed=true;}
          if(changed)await slaOp(d);
          return d;
        }
      }
    }
  }catch(e){console.log("window.storage fout:",e);}
  // Alleen leeg beginnen als er ECHT geen data is
  console.log("Geen opgeslagen data gevonden, start leeg");
  return{huidigeId:1,partijen:[]};
}
async function slaOp(d){
  try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){console.log("Opslaan mislukt:",e);}
  try{if(window.storage)await window.storage.set(SK,JSON.stringify(d));}catch(e){}
}

function Grafiek({beurten}){
  if(!beurten||beurten.length<2)return null;
  const vals=beurten.map(b=>b.caramboles);
  const maxV=Math.max(...vals,1);
  const ppp=Math.max(6,Math.min(18,300/vals.length));
  const lp=8,tp=16,H=36;
  const W=lp+ppp*(vals.length-1);
  const ps=vals.map((v,i)=>(lp+i*ppp)+","+(tp+H-(v/maxV)*H)).join(" ");
  const fs=vals.length>20?7:vals.length>12?8:9;
  return(
    <div style={{overflowX:"auto"}}>
      <svg width={Math.max(W,40)} height={H+tp+6} style={{overflow:"visible",display:"block"}}>
        <polyline points={ps} fill="none" stroke={GOUD} strokeWidth="1.5" strokeLinejoin="round"/>
        {vals.map(function(v,i){
          const cx=lp+i*ppp,cy=tp+H-(v/maxV)*H;
          const k=v>=10?"#ff9f40":v>=8?"#e8c96a":v>=5?GRNT:GOUD;
          return React.createElement("g",{key:i},
            React.createElement("circle",{cx:cx,cy:cy,r:v>=5?3:2,fill:k}),
            React.createElement("text",{x:cx,y:cy-5,textAnchor:"middle",fontSize:fs,fill:k,fontFamily:"Georgia,serif",fontWeight:v>=5?"bold":"normal"},v)
          );
        })}
      </svg>
    </div>
  );
}

function DashGrafiek({data,h=70}){
  if(!data||data.length<2)return null;
  const vals=data.filter(v=>v!==null);
  if(vals.length<1)return null;
  const max=Math.max(...vals,0.1);
  const W=data.length*16;
  // Bouw meerdere polyline segmenten zodat nulls een "gat" geven
  const segmenten=[];
  let huidig=[];
  data.forEach((v,i)=>{
    if(v!==null){
      huidig.push(`${i*16+8},${h-(v/max)*(h-8)+4}`);
    } else {
      if(huidig.length>1)segmenten.push(huidig.join(" "));
      huidig=[];
    }
  });
  if(huidig.length>1)segmenten.push(huidig.join(" "));
  return(
    <div style={{overflowX:"auto"}}>
      <svg width={W} height={h+8} style={{display:"block"}}>
        {[1,2,3].map(v=>(
          <line key={v} x1={0} y1={h-(v/max)*(h-8)+4} x2={W} y2={h-(v/max)*(h-8)+4}
            stroke={KBDR} strokeWidth="0.5" strokeDasharray="3,3"/>
        ))}
        {segmenten.map((pts,i)=>(
          <polyline key={i} points={pts} fill="none" stroke="#2d4a22" strokeWidth="1.5" strokeLinejoin="round"/>
        ))}
        {data.map((v,i)=>{
          if(v===null)return null;
          const cx=i*16+8, cy=h-(v/max)*(h-8)+4;
          const k=v>=2.5?GRNT:v>=2?GOUD:v>=1.5?WITD:ROOD;
          return <g key={i}>
            <circle cx={cx} cy={cy} r={3} fill={k}/>
            <text x={cx} y={cy-6} textAnchor="middle" fontSize="8" fill={k} fontFamily="Georgia">{v}</text>
          </g>;
        })}
      </svg>
    </div>
  );
}

// Twee losse, simpele assen:
// 1. Gemiddelde (na eventuele drops) bepaalt rechtstreeks je niveau — geen formules, geen bonus,
//    gewoon: zit je over de grens, dan zit je in het volgende niveau.
// 2. Badge-punten zijn gewoon de rechte som van je badges (Opbouw, Sterke serie, records, etc.) —
//    geen straf, geen correctie voor een laag gemiddelde. Hoe beter je speelt, hoe meer je verdient.
//    Hun enige functie: elke 1000 punten ontgrendelt het schrappen van je eerstvolgende slechtste
//    partij uit de gemiddelde-berekening (net als bij golf-handicaps) — zo krijgt goed spelen ook
//    direct invloed op je gemiddelde, zonder dat een mindere partij ooit "aftrekt".
function berekenNiveauInfo(partijen){
  const geldige=(partijen||[]).map(function(p){return{p:p,st:stat(p.beurten)};}).filter(function(x){return x.st;});
  let car=0,beurt=0;
  geldige.forEach(function(x){car+=x.st.totCar;beurt+=x.st.aantalBeurten;});
  const totaalGemiddelde=beurt>0?car/beurt:0;
  const badgePunten=berekenPrestaties(partijen,null).reduce(function(a,r){return a+r.punten;},0);

  const aantalDrops=Math.floor(badgePunten/PUNTEN_PER_DROP);
  const gesorteerd=geldige.slice().sort(function(a,b){return parseFloat(a.st.gemPerBeurt)-parseFloat(b.st.gemPerBeurt);});
  const gedropt=gesorteerd.slice(0,aantalDrops);
  const gedropteIds=new Set(gedropt.map(function(x){return x.p.id;}));
  let effCar=car,effBeurt=beurt;
  gedropt.forEach(function(x){effCar-=x.st.totCar;effBeurt-=x.st.aantalBeurten;});
  const effectiefGemiddelde=effBeurt>0?effCar/effBeurt:totaalGemiddelde;

  const gedroptePartijen=gedropt.map(function(x){
    return{id:x.p.id,datum:x.p.datum,gem:parseFloat(x.st.gemPerBeurt)};
  });

  const volgendeKandidaat=gesorteerd[aantalDrops]||null;
  const puntenTotVolgendeDrop=PUNTEN_PER_DROP-(badgePunten%PUNTEN_PER_DROP);

  return{totaalGemiddelde:totaalGemiddelde,effectiefGemiddelde:effectiefGemiddelde,badgePunten:badgePunten,
    aantalDrops:aantalDrops,gedropteIds:gedropteIds,gedroptePartijen:gedroptePartijen,
    volgendeKandidaatId:volgendeKandidaat?volgendeKandidaat.p.id:null,
    volgendeKandidaatGem:volgendeKandidaat?parseFloat(volgendeKandidaat.st.gemPerBeurt):null,
    puntenTotVolgendeDrop:puntenTotVolgendeDrop};
}
// Simuleert, uitgaande van je recente vorm (laatste 5 partijen, beurt-gewogen gemiddelde), hoeveel
// partijen je op dat niveau nog nodig hebt om je EFFECTIEVE gemiddelde over de volgende gemiddelde-
// drempel te tillen. Blijft je recente vorm onder die drempel, dan kan het nooit lukken puur op dit
// tempo — dat wordt dan ook zo teruggegeven i.p.v. een oneindig aantal partijen.
function berekenVoorspelling(partijen,discipline){
  const info=berekenNiveauInfo(partijen);
  const huidig=bepaalNiveau(info.effectiefGemiddelde,discipline);
  if(!huidig.volgende)return null;

  const geldige=(partijen||[]).map(function(p){return{p:p,st:stat(p.beurten)};}).filter(function(x){return x.st;});
  const laatste5=geldige.slice(-5);
  if(laatste5.length<3)return{mogelijk:null,recenteVorm:null};
  let rCar=0,rBeurt=0;
  laatste5.forEach(function(x){rCar+=x.st.totCar;rBeurt+=x.st.aantalBeurten;});
  const recenteVorm=rCar/rBeurt;
  const gemBeurtenPerPartij=Math.round(rBeurt/laatste5.length);

  if(recenteVorm<huidig.volgende.gemDrempel){
    return{mogelijk:false,recenteVorm:recenteVorm};
  }

  let simPartijen=partijen.slice();
  let volgendId=Math.max.apply(null,geldige.map(function(x){return x.p.id;}))+1;
  for(let i=1;i<=100;i++){
    const nieuweBeurten=[];
    let rest=Math.round(recenteVorm*gemBeurtenPerPartij);
    for(let j=0;j<gemBeurtenPerPartij;j++){
      const overgebleven=gemBeurtenPerPartij-j;
      const v=Math.max(0,Math.round(rest/overgebleven));
      nieuweBeurten.push({caramboles:v,gemist:[],goed:[]});
      rest-=v;
    }
    simPartijen=simPartijen.concat([{id:volgendId++,datum:new Date().toISOString(),tafel:"230",beurten:nieuweBeurten}]);
    const simInfo=berekenNiveauInfo(simPartijen);
    if(simInfo.effectiefGemiddelde>=huidig.volgende.gemDrempel){
      return{mogelijk:true,recenteVorm:recenteVorm,aantalPartijen:i};
    }
  }
  return{mogelijk:false,recenteVorm:recenteVorm};
}
// Berekent de eindstand van een afgesloten (of lopend) seizoen: elk seizoen wordt behandeld als een
// eigen, verse geschiedenis (badge-punten en records tellen alleen partijen binnen dat seizoen mee).
function berekenSeizoenStats(alleP,seizoen,discipline){
  const gefilterd=(alleP||[]).filter(function(p){
    const t=new Date(p.datum).getTime();
    const vanaf=seizoen.startDatum?new Date(seizoen.startDatum).getTime():-Infinity;
    const tot=seizoen.eindDatum?new Date(seizoen.eindDatum).getTime():Infinity;
    return t>=vanaf&&t<tot;
  });
  const info=berekenNiveauInfo(gefilterd);
  const niveau=bepaalNiveau(info.effectiefGemiddelde,discipline);
  let aantalPartijen=0;
  gefilterd.forEach(function(p){if(stat(p.beurten))aantalPartijen++;});
  return{seizoen:seizoen,aantalPartijen:aantalPartijen,gemiddelde:info.effectiefGemiddelde,
    badgePunten:info.badgePunten,niveau:niveau.huidig};
}

function bepaalNiveau(effectiefGemiddelde,discipline){
  const niveaus=(DISCIPLINES[discipline]||DISCIPLINES.libre).niveaus;
  let idx=0;
  for(let i=0;i<niveaus.length;i++){
    if(effectiefGemiddelde>=niveaus[i].gemDrempel)idx=i;
  }
  const huidig=niveaus[idx];
  const volgende=niveaus[idx+1]||null;
  const progressPct=volgende?Math.min(100,Math.max(0,Math.round((effectiefGemiddelde-huidig.gemDrempel)/(volgende.gemDrempel-huidig.gemDrempel)*100))):100;
  const sterren=Math.max(1,Math.min(5,Math.ceil(progressPct/20)));
  return{huidig:huidig,volgende:volgende,progressPct:progressPct,sterren:sterren,index:idx};
}

function Dashboard({partijen,niveau,tijdsvensterMaanden,discipline}){
  // ST wordt live afgeleid van de echte partijen (inclusief nieuwe partijen en comments)
  const ST=useMemo(()=>{
    return (partijen||[]).map(function(p){
      const st=stat(p.beurten);
      if(!st)return null;
      return{id:p.id,datum:p.datum,tafel:p.tafel||"230",tot:st.totCar,n:st.aantalBeurten,max:st.max,poedels:st.poedels,opbouw:st.opbouw5,gem:parseFloat(st.gemPerBeurt),beurten:p.beurten};
    }).filter(Boolean);
  },[partijen]);

  const [va,setVa]=useState(0);
  const [tot,setTot]=useState(Math.max(ST.length-1,0));
  const [w3,setW3]=useState(true);
  const [w5,setW5]=useState(true);
  const [trimL,setTrimL]=useState(0);
  const [trimH,setTrimH]=useState(0);
  const [tab,setTab]=useState("trend");
  const [tafelFilter,setTafelFilter]=useState("alle");
  const [niveauOpen,setNiveauOpen]=useState(false);
  const [badgeCatalogusOpen,setBadgeCatalogusOpen]=useState(false);
  const [uitlegModus,setUitlegModus]=useState(false);
  const [uitlegSectie,setUitlegSectie]=useState(null);
  const [geselecteerdeMaanden,setGeselecteerdeMaanden]=useState(null); // null=uit, anders Set van maand-keys

  const selRange=useMemo(()=>{
    if(geselecteerdeMaanden&&geselecteerdeMaanden.size>0){
      return ST.filter(p=>geselecteerdeMaanden.has(maandKey(p.datum)));
    }
    return ST.slice(va,tot+1);
  },[ST,va,tot,geselecteerdeMaanden]);
  const sel=useMemo(()=>tafelFilter==="alle"?selRange:selRange.filter(p=>p.tafel===tafelFilter),[selRange,tafelFilter]);

  const maxTrim=Math.max(0,Math.floor((sel.length-1)/2));
  const trimLClamped=Math.min(trimL,maxTrim);
  const trimHClamped=Math.min(trimH,maxTrim);

  const filt=useMemo(()=>{
    const s=[...sel].sort((a,b)=>a.gem-b.gem);
    const ids=new Set(s.slice(trimLClamped,s.length-trimHClamped).map(p=>p.id));
    return sel.filter(p=>ids.has(p.id));
  },[sel,trimLClamped,trimHClamped]);

  const filtTot=filt.reduce((a,p)=>a+p.tot,0);
  const filtN=filt.reduce((a,p)=>a+p.n,0);
  const gemGem=filtN>0?(filtTot/filtN).toFixed(2):"—";
  // Drempels schuiven mee met je huidige gemiddelde: eerste drempel is het hoogste 0,5-veelvoud
  // op of onder je gemiddelde, daarna telkens +0,5.
  const eersteDrempel=Math.floor((niveau.effectiefGemiddelde||0)/0.5)*0.5;
  const drempD1=eersteDrempel,drempD2=eersteDrempel+0.5,drempD3=eersteDrempel+1.0,drempD4=eersteDrempel+1.5;
  const b15=Math.round(filt.filter(p=>p.gem>=drempD1).length/Math.max(filt.length,1)*100);
  const b20=Math.round(filt.filter(p=>p.gem>=drempD2).length/Math.max(filt.length,1)*100);
  const b25=Math.round(filt.filter(p=>p.gem>=drempD3).length/Math.max(filt.length,1)*100);
  const b30=Math.round(filt.filter(p=>p.gem>=drempD4).length/Math.max(filt.length,1)*100);

  // rolGems: behoudt originele volgorde van sel, null voor weggefilterde partijen (voor de puntjes-grafiek, per partij)
  const filtIds=useMemo(()=>new Set(filt.map(p=>p.id)),[filt]);
  const rolGems=sel.map(p=>filtIds.has(p.id)?p.gem:null);
  // rolData: tot/n per partij, voor beurt-gewogen rolling gemiddeldes
  const rolData=sel.map(p=>filtIds.has(p.id)?{tot:p.tot,n:p.n}:null);
  const r3=rolData.map((_,i)=>{
    const slice=rolData.slice(Math.max(0,i-2),i+1).filter(v=>v!==null);
    if(slice.length<3)return null;
    const sTot=slice.reduce((a,v)=>a+v.tot,0),sN=slice.reduce((a,v)=>a+v.n,0);
    return parseFloat((sTot/sN).toFixed(2));
  });
  const r5=rolData.map((_,i)=>{
    const slice=rolData.slice(Math.max(0,i-4),i+1).filter(v=>v!==null);
    if(slice.length<5)return null;
    const sTot=slice.reduce((a,v)=>a+v.tot,0),sN=slice.reduce((a,v)=>a+v.n,0);
    return parseFloat((sTot/sN).toFixed(2));
  });

  // Maand-blokken voor de snelfilters, dynamisch afgeleid van de echte data
  const maandBlokken=useMemo(()=>{
    const blocks=[];
    ST.forEach((p,i)=>{
      const key=maandKey(p.datum);
      const last=blocks[blocks.length-1];
      if(last&&last.key===key){last.eind=i;}
      else blocks.push({key,begin:i,eind:i});
    });
    return blocks;
  },[ST]);

  // Vergelijking eerste vs tweede helft
  const h=Math.floor(sel.length/2);
  const h1=sel.slice(0,h), h2=sel.slice(h);
  const g1=h1.length?((h1.reduce((a,p)=>a+p.tot,0))/(h1.reduce((a,p)=>a+p.n,0))).toFixed(2):"—";
  const g2=h2.length?((h2.reduce((a,p)=>a+p.tot,0))/(h2.reduce((a,p)=>a+p.n,0))).toFixed(2):"—";

  // Per maand
  const maandGroepen=useMemo(()=>{
    const groups={};
    sel.forEach(p=>{
      const k=maandKey(p.datum);
      if(!groups[k])groups[k]=[];
      groups[k].push(p);
    });
    return Object.entries(groups);
  },[sel]);

  // ── PUNTEN: prestatie-badges, chronologisch berekend over de volledige geschiedenis ──
  const prestatiesMap=useMemo(()=>{
    const m={};
    berekenPrestaties(partijen,tijdsvensterMaanden).forEach(r=>{m[r.id]=r;});
    return m;
  },[partijen,tijdsvensterMaanden]);
  const puntenSel=useMemo(()=>sel.map(p=>Object.assign({},p,prestatiesMap[p.id]||{badges:[],punten:0})),[sel,prestatiesMap]);
  const totaalPuntenSel=puntenSel.reduce((a,p)=>a+p.punten,0);
  const gemPuntenSel=puntenSel.length?Math.round(totaalPuntenSel/puntenSel.length):0;
  const top5Punten=useMemo(()=>[...puntenSel].sort((a,b)=>b.punten-a.punten).slice(0,5),[puntenSel]);
  const badgeFrequentie=useMemo(()=>{
    const freq={};
    puntenSel.forEach(p=>{
      (p.badges||[]).forEach(b=>{
        if(!freq[b.label])freq[b.label]={emoji:b.emoji,aantal:0,punten:0};
        freq[b.label].aantal+=b.aantal;
        freq[b.label].punten+=b.punten;
      });
    });
    return Object.entries(freq).sort((a,b)=>b[1].punten-a[1].punten);
  },[puntenSel]);

  // ── PATRONEN: tag-analyse, verdeling per beurt, poedel-herstel ──
  const gemistCounts=useMemo(()=>{
    const c={};
    sel.forEach(p=>p.beurten.forEach(b=>(b.gemist||[]).forEach(t=>{c[t]=(c[t]||0)+1;})));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]);
  },[sel]);
  const goedCounts=useMemo(()=>{
    const c={};
    sel.forEach(p=>p.beurten.forEach(b=>(b.goed||[]).forEach(t=>{c[t]=(c[t]||0)+1;})));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]);
  },[sel]);

  const histData=useMemo(()=>{
    const buckets=[["0 (poedel)",0,0],["1-2",1,2],["3-4",3,4],["5-7",5,7],["8-9",8,9],["10+",10,Infinity]];
    const allCar=sel.flatMap(p=>p.beurten.map(b=>b.caramboles));
    const counts=buckets.map(([label,lo,hi])=>({label,n:allCar.filter(c=>c>=lo&&c<=hi).length}));
    return{counts,totBeurt:allCar.length};
  },[sel]);

  const poedelHerstel=useMemo(()=>{
    let tilt=0,klein=0,sterk=0,totaalPoedels=0,geenVolgende=0;
    sel.forEach(p=>{
      const bs=p.beurten;
      bs.forEach((b,i)=>{
        if(b.caramboles===0){
          totaalPoedels++;
          const next=bs[i+1];
          if(!next){geenVolgende++;return;}
          if(next.caramboles===0)tilt++;
          else if(next.caramboles>=5)sterk++;
          else klein++;
        }
      });
    });
    return{tilt,klein,sterk,totaalPoedels,basis:totaalPoedels-geenVolgende};
  },[sel]);

  const kaart=(label,waarde,sub,kleur=GOUD)=>(
    <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
      <div style={{fontSize:12,color:WITD,textTransform:"uppercase",letterSpacing:1,marginBottom:3}}>{label}</div>
      <div style={{fontSize:26,fontWeight:"bold",color:kleur,lineHeight:1}}>{waarde}</div>
      {sub&&<div style={{fontSize:12,color:WITD,marginTop:3}}>{sub}</div>}
    </div>
  );

  const UITLEG_TEKST={
    trend:"Hoe je gemiddelde zich ontwikkelt over de tijd. Met een rollend gemiddelde over 3 en 5 partijen, en een schuifje om uitschieters (heel goede of slechte partijen) tijdelijk weg te filteren.",
    consist:"Hoeveel procent van je partijen boven bepaalde gemiddelde-drempels uitkomt — die drempels schuiven automatisch mee met je eigen niveau, in stappen van 0,5. Plus je 5 beste en 5 slechtste partijen op een rij.",
    patronen:"Analyse van je opmerkingen (wat je vaak mist of juist goed doet), hoe je caramboles per beurt verdeeld zijn, en hoe je herstelt na een poedel.",
    vergelijk:"Vergelijkt de eerste met de tweede helft van je geselecteerde partijen (zie je progressie?), en toont je gemiddelde per maand naast elkaar.",
    punten:"Je niveau, badge-punten, mijlpalen, en een overzicht van je best scorende partijen op badges."
  };
  const btn=(k,l)=>(
    <button onClick={function(){if(uitlegModus){setUitlegSectie(k);}else{setTab(k);}}} style={{flex:1,padding:"10px 0",background:tab===k&&!uitlegModus?"#1c2c1c":"none",
      border:"none",color:tab===k&&!uitlegModus?GOUD:(uitlegModus?"#7fd8e0":WITD),fontSize:13,cursor:"pointer",fontFamily:"Georgia,serif",
      borderBottom:tab===k&&!uitlegModus?`2px solid ${GOUD}`:"2px solid transparent"}}>
      {l}
    </button>
  );

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:G,fontFamily:"Georgia,serif",color:WIT}}>

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0d1f0d,#182e14)",borderBottom:`2px solid ${GOUD}`,padding:"10px 14px",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:15,fontWeight:"bold",color:GOUD,letterSpacing:1}}>Biljart Dashboard</div>
          <div style={{fontSize:12,color:WITD,letterSpacing:2,textTransform:"uppercase"}}>Analyse & trends · {ST.length} partijen</div>
        </div>
        <button onClick={function(){setUitlegModus(function(v){return !v;});setUitlegSectie(null);}}
          style={{padding:"6px 12px",background:uitlegModus?"#2d4a1e":"none",border:"1px solid "+(uitlegModus?GOUD:KBDR),borderRadius:8,color:uitlegModus?GOUD:WITD,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {uitlegModus?"✕ Sluit uitleg":"❓ Uitleg"}
        </button>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:`1px solid ${KBDR}`,background:"#152015",flexShrink:0}}>
        {btn("trend","Trend")}
        {btn("consist","Consistentie")}
        {btn("patronen","Patronen")}
        {btn("vergelijk","Vergelijk")}
        {btn("punten","Punten")}
      </div>

      {/* Partijselectie */}
      <div style={{background:"#152015",padding:"8px 14px",borderBottom:`1px solid ${KBDR}`,flexShrink:0}}>
        <div style={{fontSize:12,color:WITD,marginBottom:5}}>
          {geselecteerdeMaanden&&geselecteerdeMaanden.size>0
            ?<>Selectie: {[...geselecteerdeMaanden].join(", ")} · <span style={{color:GOUD}}>{filt.length} partijen</span></>
            :<>Selectie: p{va+1}–p{tot+1} · <span style={{color:GOUD}}>{filt.length} partijen</span></>
          }
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:12,color:WITD,minWidth:14}}>{va+1}</span>
          <input type="range" min={0} max={Math.max(ST.length-1,0)} value={va}
            onChange={e=>{setGeselecteerdeMaanden(null);setVa(Math.min(+e.target.value,tot-1));}}
            style={{flex:1,accentColor:GOUD}}/>
          <input type="range" min={0} max={Math.max(ST.length-1,0)} value={tot}
            onChange={e=>{setGeselecteerdeMaanden(null);setTot(Math.max(+e.target.value,va+1));}}
            style={{flex:1,accentColor:GOUD}}/>
          <span style={{fontSize:12,color:WITD,minWidth:14}}>{tot+1}</span>
        </div>
        <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2}}>
          {[["Alles",0,Math.max(ST.length-1,0)]].concat(ST.length>10?[["Laatste 10",ST.length-10,ST.length-1]]:[]).map(([l,v,t])=>{
            const actief=(!geselecteerdeMaanden||geselecteerdeMaanden.size===0)&&va===v&&tot===t;
            return(
              <button key={l} onClick={()=>{setGeselecteerdeMaanden(null);setVa(v);setTot(t);}}
                style={{flex:"0 0 auto",padding:"4px 10px",background:actief?"#2d4a1e":"none",border:`1px solid ${actief?GOUD:KBDR}`,
                  borderRadius:5,color:actief?GOUD:WITD,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                {l}
              </button>
            );
          })}
          {maandBlokken.map(b=>{
            const actief=geselecteerdeMaanden?geselecteerdeMaanden.has(b.key):false;
            return(
              <button key={b.key} onClick={()=>{
                setGeselecteerdeMaanden(prev=>{
                  const huidige=prev?new Set(prev):new Set();
                  if(huidige.has(b.key))huidige.delete(b.key);
                  else huidige.add(b.key);
                  return huidige;
                });
              }}
                style={{flex:"0 0 auto",padding:"4px 10px",background:actief?"#2d4a1e":"none",border:`1px solid ${actief?GOUD:KBDR}`,
                  borderRadius:5,color:actief?GOUD:WITD,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                {b.key}
              </button>
            );
          })}
        </div>
        <div style={{display:"flex",gap:5,marginTop:6,overflowX:"auto",paddingBottom:2}}>
          {[["alle","Alle tafels"]].concat(Object.keys(TAFELS).map(function(t){return[t,TAFELS[t].label];})).map(([k,l])=>(
            <button key={k} onClick={()=>setTafelFilter(k)}
              style={{flex:"0 0 auto",padding:"4px 12px",background:tafelFilter===k?"#2d4a1e":"none",border:`1px solid ${tafelFilter===k?GOUD:KBDR}`,
                borderRadius:5,color:tafelFilter===k?GOUD:WITD,fontSize:12,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>

        {/* TREND */}
        {tab==="trend"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {kaart("Gem.",gemGem,"per beurt",parseFloat(gemGem)>=2.5?GRNT:parseFloat(gemGem)>=2?GOUD:ROOD)}
            {kaart("Max",filt.length?Math.max(...filt.map(p=>p.gem)):"—","partij",GOUDL)}
            {kaart("Opbouw",filt.length?Math.round(filt.reduce((a,p)=>a+p.opbouw,0)/filt.reduce((a,p)=>a+p.n,0)*100)+"%":"—","beurten ≥5",GRNT)}
          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1}}>{filt.length>=3?"Rolling gemiddelde":"Gemiddelde per partij"}</span>
              <div style={{display:"flex",gap:6}}>
                {filt.length>=3&&<button onClick={()=>setW3(!w3)} style={{background:"none",border:`1px solid ${w3?GOUD:KBDR}`,
                  borderRadius:4,color:w3?GOUD:WITD,fontSize:12,padding:"2px 8px",cursor:"pointer",fontFamily:"inherit"}}>3p</button>}
                {filt.length>=5&&<button onClick={()=>setW5(!w5)} style={{background:"none",border:`1px solid ${w5?WIT:KBDR}`,
                  borderRadius:4,color:w5?WIT:WITD,fontSize:12,padding:"2px 8px",cursor:"pointer",fontFamily:"inherit"}}>5p</button>}
              </div>
            </div>
            <div style={{fontSize:12,color:WITD,marginBottom:6,display:"flex",gap:12}}>
              <span style={{color:"#3a5c35"}}>● Ruw</span>
              {filt.length>=3&&w3&&<span style={{color:GOUD}}>── 3-partij</span>}
              {filt.length>=5&&w5&&<span style={{color:WIT}}>╌╌ 5-partij</span>}
            </div>
            <DashGrafiek data={rolGems}/>
            {((filt.length>=3&&w3)||(filt.length>=5&&w5))&&<div style={{marginTop:6,display:"flex",gap:12,fontSize:13}}>
              {filt.length>=3&&w3&&<span style={{color:GOUD}}>3p nu: <strong>{r3.filter(v=>v!==null).slice(-1)[0]}</strong></span>}
              {filt.length>=5&&w5&&<span style={{color:WIT}}>5p nu: <strong>{r5.filter(v=>v!==null).slice(-1)[0]}</strong></span>}
            </div>}
          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Uitschieters weggooien</div>
            <div style={{display:"flex",gap:10,marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:ROOD,marginBottom:4}}>Slechtste {trimLClamped} weg</div>
                <input type="range" min={0} max={maxTrim} step={1} value={trimLClamped}
                  onChange={e=>setTrimL(+e.target.value)} style={{width:"100%",accentColor:ROOD}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:GRNT,marginBottom:4}}>Beste {trimHClamped} weg</div>
                <input type="range" min={0} max={maxTrim} step={1} value={trimHClamped}
                  onChange={e=>setTrimH(+e.target.value)} style={{width:"100%",accentColor:GRNT}}/>
              </div>
            </div>
            <div style={{textAlign:"center",background:"#1a3019",borderRadius:8,padding:"8px"}}>
              <span style={{fontSize:13,color:WITD}}>Gefilterd gemiddelde: </span>
              <span style={{fontSize:20,fontWeight:"bold",color:parseFloat(gemGem)>=2?GOUD:WITD}}>{gemGem}</span>
            </div>
          </div>
        </div>}

        {/* CONSISTENTIE */}
        {tab==="consist"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"14px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>% boven drempel</div>
            {[[drempD1,b15,"#5a8a50"],[drempD2,b20,GOUD],[drempD3,b25,"#e8a84c"],[drempD4,b30,ROOD]].map(([d,pct,k])=>(
              <div key={d} style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:14,color:WITD}}>Boven {d}</span>
                  <span style={{fontSize:18,fontWeight:"bold",color:k}}>{pct}%</span>
                </div>
                <DashBalk pct={pct} kleur={k}/>
                <div style={{fontSize:12,color:WITD,marginTop:2}}>
                  {filt.filter(p=>p.gem>=d).length} van {filt.length} partijen
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
              <div style={{fontSize:13,color:GRNT,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Beste 5</div>
              {[...filt].sort((a,b)=>b.gem-a.gem).slice(0,5).map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:`1px solid ${KBDR}`}}>
                  <span style={{fontSize:13,color:WITD}}>p{p.id} {fmtDatum(p.datum)}</span>
                  <span style={{fontSize:14,fontWeight:"bold",color:GRNT}}>{p.gem}</span>
                </div>
              ))}
            </div>
            <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
              <div style={{fontSize:13,color:ROOD,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Slechtste 5</div>
              {[...filt].sort((a,b)=>a.gem-b.gem).slice(0,5).map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:`1px solid ${KBDR}`}}>
                  <span style={{fontSize:13,color:WITD}}>p{p.id} {fmtDatum(p.datum)}</span>
                  <span style={{fontSize:14,fontWeight:"bold",color:ROOD}}>{p.gem}</span>
                </div>
              ))}
            </div>
          </div>
        </div>}

        {/* PATRONEN */}
        {tab==="patronen"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Meest genoteerde redenen</div>
            {gemistCounts.length===0&&goedCounts.length===0
              ?<div style={{fontSize:14,color:WITD}}>Nog geen opmerkingen genoteerd in deze selectie.</div>
              :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div>
                  <div style={{fontSize:13,color:ROOD,marginBottom:6}}>Gemist door</div>
                  {gemistCounts.length===0?<div style={{fontSize:13,color:WITD}}>—</div>:gemistCounts.slice(0,8).map(([label,n])=>(
                    <div key={label} style={{marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:WITD,marginBottom:2}}>
                        <span>{label}</span><span>{n}x</span>
                      </div>
                      <DashBalk pct={Math.round(n/gemistCounts[0][1]*100)} kleur={ROOD} hoogte={5}/>
                    </div>
                  ))}
                </div>
                <div>
                  <div style={{fontSize:13,color:GRNT,marginBottom:6}}>Ging goed door</div>
                  {goedCounts.length===0?<div style={{fontSize:13,color:WITD}}>—</div>:goedCounts.slice(0,8).map(([label,n])=>(
                    <div key={label} style={{marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:WITD,marginBottom:2}}>
                        <span>{label}</span><span>{n}x</span>
                      </div>
                      <DashBalk pct={Math.round(n/goedCounts[0][1]*100)} kleur={GRNT} hoogte={5}/>
                    </div>
                  ))}
                </div>
              </div>
            }
          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Verdeling caramboles per beurt</div>
            {histData.totBeurt===0
              ?<div style={{fontSize:14,color:WITD}}>Geen beurten in selectie.</div>
              :<>
                {histData.counts.map(({label,n})=>{
                  const pct=Math.round(n/histData.totBeurt*100);
                  const kleur=label==="0 (poedel)"?"#e08055":label==="10+"?"#ff9f40":label==="8-9"?GOUDL:label==="5-7"?GRNT:GOUD;
                  return(
                    <div key={label} style={{marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                        <span style={{fontSize:14,color:WITD}}>{label}</span>
                        <span style={{fontSize:14,fontWeight:"bold",color:kleur}}>{n}x · {pct}%</span>
                      </div>
                      <DashBalk pct={pct} kleur={kleur}/>
                    </div>
                  );
                })}
                <div style={{fontSize:12,color:WITD,marginTop:2}}>{histData.totBeurt} beurten totaal</div>
              </>
            }
          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Na een poedel</div>
            {poedelHerstel.basis===0
              ?<div style={{fontSize:14,color:WITD}}>Geen poedels met vervolgbeurt in selectie.</div>
              :<>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
                  {kaart("Opnieuw poedel",Math.round(poedelHerstel.tilt/poedelHerstel.basis*100)+"%",poedelHerstel.tilt+"x",ROOD)}
                  {kaart("Klein herstel",Math.round(poedelHerstel.klein/poedelHerstel.basis*100)+"%",poedelHerstel.klein+"x",GOUD)}
                  {kaart("Sterk herstel",Math.round(poedelHerstel.sterk/poedelHerstel.basis*100)+"%",poedelHerstel.sterk+"x (5+)",GRNT)}
                </div>
                <div style={{fontSize:12,color:WITD}}>Gebaseerd op {poedelHerstel.basis} poedels ({poedelHerstel.totaalPoedels} totaal in selectie)</div>
              </>
            }
          </div>

        </div>}

        {/* VERGELIJK */}
        {tab==="vergelijk"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Eerste vs tweede helft</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              {[[`p1–p${h}`,g1,h1],[`p${h+1}–p${sel.length}`,g2,h2]].map(([label,gem,ps])=>(
                <div key={label} style={{background:"#1a3019",borderRadius:8,padding:"12px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:WITD,marginBottom:4}}>{label}</div>
                  <div style={{fontSize:28,fontWeight:"bold",color:parseFloat(gem)>=2.5?GRNT:parseFloat(gem)>=2?GOUD:ROOD}}>{gem}</div>
                  <div style={{fontSize:12,color:WITD,marginTop:4}}>{ps.length} partijen</div>

        </div>}

        {/* PUNTEN */}
        {tab==="punten"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>

          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {kaart("Totaal",totaalPuntenSel,"punten",GOUD)}
            {kaart("Gem.",gemPuntenSel,"per partij",GOUDL)}
            {kaart("Beste partij",top5Punten.length?top5Punten[0].punten:0,top5Punten.length?"p"+top5Punten[0].id:"—",GRNT)}
          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Beste partijen op punten</div>
            {top5Punten.length===0||top5Punten[0].punten===0
              ?<div style={{fontSize:14,color:WITD}}>Nog geen prestaties behaald in deze selectie.</div>
              :top5Punten.filter(p=>p.punten>0).map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${KBDR}`}}>
                  <span style={{fontSize:13,color:WITD}}>p{p.id} · {fmtDatum(p.datum)} <span style={{color:WITD,opacity:0.7}}>({p.badges.length} badges)</span></span>
                  <span style={{fontSize:15,fontWeight:"bold",color:GOUD}}>{p.punten}pt</span>
                </div>
              ))

          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Meest behaalde prestaties</div>
            {badgeFrequentie.length===0
              ?<div style={{fontSize:14,color:WITD}}>Nog geen prestaties behaald in deze selectie.</div>
              :badgeFrequentie.map(([label,d])=>(
                <div key={label} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${KBDR}`}}>
                  <span style={{fontSize:13,color:WITD}}>{d.emoji} {label} <span style={{color:WITD,opacity:0.7}}>×{d.aantal}</span></span>

          </div>

          <div style={{background:KBG,border:`1px solid ${KBDR}`,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:13,color:GOUD,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Mijlpalen</div>
            <div style={{fontSize:11,color:WITD,opacity:0.75,marginBottom:10}}>Voor trouw blijven spelen — los van je niveau of gemiddelde</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {berekenMijlpalen(partijen).map(function(m){
                return(
                  <div key={m.type+m.aantal} style={{background:m.bereikt?"rgba(201,168,76,0.15)":"#1c2e18",border:"1px solid "+(m.bereikt?GOUD:KBDR),borderRadius:8,padding:"8px 4px",textAlign:"center",opacity:m.bereikt?1:0.55}}>
                    <div style={{fontSize:18}}>{m.emoji}</div>

      {uitlegSectie&&(
        <div onClick={function(){setUitlegSectie(null);}} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:250,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"pointer"}}>
          <div onClick={function(e){e.stopPropagation();}} style={{background:"linear-gradient(160deg,#1e3a1e,#0d1f0d)",border:"2px solid #7fd8e0",borderRadius:16,padding:"18px 18px",maxWidth:340,width:"100%",boxShadow:"0 10px 40px rgba(0,0,0,0.6)"}}>
            <div style={{fontSize:16,fontWeight:"bold",color:"#7fd8e0",marginBottom:8}}>❓ {uitlegSectie==="consist"?"Consistentie":uitlegSectie.charAt(0).toUpperCase()+uitlegSectie.slice(1)}</div>
            <div style={{fontSize:14,color:WITD,lineHeight:1.5}}>{UITLEG_TEKST[uitlegSectie]}</div>
            <div onClick={function(){setUitlegSectie(null);}} style={{textAlign:"center",marginTop:14,fontSize:12,color:WITD,opacity:0.7,cursor:"pointer",padding:"6px 0"}}>Tik om te sluiten</div>
          </div>
        </div>
      )}
    </div>
  );
}


function LogPartijRij({p,nr,prestatie,gedropt,onVerwijder,onNotitie}){

  const [confVerwijder,setConfVerwijder]=useState(false);
  const [notitieTekst,setNotitieTekst]=useState(p.notitie||"");
  const st=stat(p.beurten);
  const punten=prestatie?prestatie.punten:0;
  return(
    <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,marginBottom:10}}>
      <button onClick={function(){setOpen(function(v){return !v;});}}
        style={{width:"100%",background:"none",border:"none",color:"inherit",cursor:"pointer",fontFamily:"inherit",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left"}}>
        <div>
          <div style={{fontSize:15,color:GOUD,textDecoration:gedropt?"line-through":"none",opacity:gedropt?0.6:1}}>p{nr} - {new Date(p.datum).toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})}{p.tafel&&<span style={{fontSize:13,color:WITD,marginLeft:6,border:"1px solid "+KBDR,borderRadius:4,padding:"1px 5px"}}>{tafelLabel(p.tafel)}</span>}{punten>0&&<span style={{fontSize:13,color:GOUD,marginLeft:6,border:"1px solid "+GOUD,borderRadius:4,padding:"1px 5px"}}>{punten}pt</span>}{gedropt&&<span style={{fontSize:13,color:"#e8c96a",marginLeft:6}}>🏅 geschrapt uit gemiddelde</span>}{p.notitie&&<span style={{fontSize:13,marginLeft:6}}>📝</span>}</div>
          {st&&<div style={{fontSize:13,color:WITD,marginTop:2,opacity:gedropt?0.6:1}}>{st.totCar} car - {st.aantalBeurten}b - gem {st.gemPerBeurt} - max {st.max} - {st.poedels}x poedel</div>}
        </div>
        <span style={{color:GOUD,fontSize:14,marginLeft:8}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{padding:"0 14px 12px"}}>
          <PrestatieOverzicht prestatie={prestatie}/>
          {[].concat(p.beurten).reverse().map(function(b,i){return <LogRij key={b.id} b={b} nr={p.beurten.length-i}/>;}) }
          {onNotitie&&(
            <div style={{marginTop:8}}>
              <div style={{fontSize:12,color:WITD,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Notitie</div>
              <textarea value={notitieTekst} onChange={function(e){setNotitieTekst(e.target.value);}}
                placeholder="Sfeer, met wie, hoe het voelde..."
                style={{width:"100%",minHeight:50,background:"#182e14",border:"1px solid "+KBDR,borderRadius:6,color:WIT,fontSize:13,padding:8,fontFamily:"inherit",resize:"vertical"}}/>
              {notitieTekst!==(p.notitie||"")&&(
                <button style={{marginTop:6,padding:"6px 12px",background:"#2d4a1e",border:"1px solid "+GOUD,borderRadius:6,color:GOUD,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}
                  onClick={function(){onNotitie(p.id,notitieTekst);}}>Notitie opslaan</button>
              )}
            </div>
          )}
          {onVerwijder&&(
            !confVerwijder
              ?<button style={{marginTop:8,padding:"6px 10px",background:"none",border:"1px solid #7a3030",borderRadius:6,color:"#e06060",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}
                onClick={function(){setConfVerwijder(true);}}>Partij verwijderen</button>
              :<div style={{marginTop:8,background:"#2a1515",border:"1px solid #7a3030",borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:13,color:"#e06060",marginBottom:6}}>Deze partij definitief verwijderen?</div>
                <div style={{display:"flex",gap:6}}>
                  <button style={{flex:1,padding:6,background:"#7a3030",border:"none",borderRadius:5,color:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:13}}
                    onClick={function(){onVerwijder(p.id);}}>Ja, verwijderen</button>
                  <button style={{flex:1,padding:6,background:"none",border:"1px solid "+KBDR,borderRadius:5,color:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:13}}
                    onClick={function(){setConfVerwijder(false);}}>Annuleer</button>
                </div>
              </div>
          )}
        </div>
      )}
    </div>
  );
}

function BiljartTracker(){
  const [data,setData]=useState(null);
  const [tab,setTab]=useState("spelen");
  const [car,setCar]=useState(0);
  const [inp,setInp]=useState("0");
  const [beurtNr,setBeurtNr]=useState(1);
  const [sel,setSel]=useState(new Set());
  const [andersGemist,setAndersGemist]=useState("");
  const [andersGoed,setAndersGoed]=useState("");
  const [fase,setFase]=useState("setup");
  const [lp,setLp]=useState([]);
  const [doel,setDoel]=useState(25);
  const [doelType,setDoelType]=useState("beurten");
  const [tafel,setTafel]=useState("210");
  const [confPartij,setConfPartij]=useState(false);
  const [confReset,setConfReset]=useState(false);
  const [confSeizoenAfsluiten,setConfSeizoenAfsluiten]=useState(false);
  const [confSeizoenOngedaan,setConfSeizoenOngedaan]=useState(false);
  const [seizoenArchiefOpen,setSeizoenArchiefOpen]=useState(false);
  const [onboardingStap,setOnboardingStap]=useState(0);
  const [deelResultaat,setDeelResultaat]=useState("");
  const [gekopieerd,setGekopieerd]=useState("");
  const [toonData,setToonData]=useState(false);
  const inputRef=useRef(null);
  const statsScrollRef=useRef(null);
  const [toastGroep,setToastGroep]=useState(null);
  const [niveauOpen,setNiveauOpen]=useState(false);
  const [partijSamenvatting,setPartijSamenvatting]=useState(null);
  const [niveauUpInfo,setNiveauUpInfo]=useState(null);

  const tijdsvenster=(data&&data.tijdsvenster)||"alles";
  const tijdsvensterMaanden=tijdsvenster==="alles"?null:parseInt(tijdsvenster,10);
  const huidigeDiscplineVoorLading=(data&&data.huidigeDiscipline)||"libre";

  const alleP=useMemo(function(){
    if(!data)return[];
    return data.partijen.filter(function(p){return(p.discipline||"libre")===huidigeDiscplineVoorLading;});
  },[data,huidigeDiscplineVoorLading]);

  const prestatiesMap=useMemo(function(){
    const arr=berekenPrestaties(alleP,tijdsvensterMaanden);
    const m={};
    arr.forEach(function(r){m[r.id]=r;});
    return m;
  },[alleP,tijdsvensterMaanden]);
  const huidigeRecords=useMemo(function(){
    return berekenLopendeRecords(alleP,tijdsvensterMaanden);
  },[alleP,tijdsvensterMaanden]);
  const niveau=useMemo(function(){
    // Niveau gebruikt altijd all-time data binnen de huidige discipline (los van de tijdsvenster-
    // instelling hierboven, die alleen de ⭐-drempels en 👑🏓-records beïnvloedt).
    const info=berekenNiveauInfo(alleP);
    const voorspelling=berekenVoorspelling(alleP,huidigeDiscplineVoorLading);
    let aantalPartijen=0;
    alleP.forEach(function(p){
      if(stat(p.beurten))aantalPartijen++;
    });
    return Object.assign({},bepaalNiveau(info.effectiefGemiddelde,huidigeDiscplineVoorLading),{
      totaalGemiddelde:info.totaalGemiddelde,
      effectiefGemiddelde:info.effectiefGemiddelde,
      badgePunten:info.badgePunten,
      aantalDrops:info.aantalDrops,
      gedropteIds:info.gedropteIds,
      gedroptePartijen:info.gedroptePartijen,
      volgendeKandidaatId:info.volgendeKandidaatId,
      volgendeKandidaatGem:info.volgendeKandidaatGem,
      puntenTotVolgendeDrop:info.puntenTotVolgendeDrop,
      voorspelling:voorspelling,
      aantalPartijen:aantalPartijen
    });
  },[alleP,huidigeDiscplineVoorLading]);

  useEffect(function(){
    if(!data)return;
    if(data.laatstGezienNiveauIndex===undefined){
      const nd=Object.assign({},data,{laatstGezienNiveauIndex:niveau.index});
      setData(nd);slaOp(nd);
      return;
    }
    if(niveau.index>data.laatstGezienNiveauIndex){
      const niveaus=(DISCIPLINES[huidigeDiscplineVoorLading]||DISCIPLINES.libre).niveaus;
      setNiveauUpInfo({van:niveaus[data.laatstGezienNiveauIndex],naar:niveau.huidig});
      const nd=Object.assign({},data,{laatstGezienNiveauIndex:niveau.index});
      setData(nd);slaOp(nd);
    }
  },[niveau.index]);

  useEffect(function(){laadData().then(setData);},[]);
  if(!data)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:GOUD,fontSize:18,background:G}}>Laden...</div>;

  const huidigeDiscipline=huidigeDiscplineVoorLading;
  const stL=stat(lp);
  const totCarLp=lp.reduce(function(a,b){return a+b.caramboles;},0);
  const voortgang=doelType==="beurten"?lp.length:totCarLp;
  const progPct=Math.min(100,Math.round(voortgang/doel*100));

  function toggle(key){setSel(function(prev){const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});}

  function toonToast(items){
    if(items&&items.length)setToastGroep(items);
  }

  function checkLiveBadges(lpVoor,car){
    const items=[];
    if(car>=5&&car<=7)items.push({emoji:"🎯",label:"Opbouw",punten:10,categorie:"Beurt-pieken"});
    else if(car>=8&&car<=9)items.push({emoji:"🔥",label:"Sterke serie",punten:20,categorie:"Beurt-pieken"});
    else if(car>=10)items.push({emoji:"💫",label:"Topserie",punten:35,categorie:"Beurt-pieken"});

    const maxInPartijVoor=lpVoor.length?Math.max.apply(null,lpVoor.map(function(x){return x.caramboles;})):0;
    if(car>huidigeRecords.allTimeMaxBeurt&&huidigeRecords.allTimeMaxBeurt>0&&car>maxInPartijVoor){
      items.push({emoji:"🏆",label:"Nieuw record beurt!",punten:50,categorie:"Beurt-pieken"});
    }

    if(lpVoor.length>0&&lpVoor[lpVoor.length-1].caramboles===0&&car>=5){
      items.push({emoji:"💪",label:"Sterk herstel na poedel",punten:15,categorie:"Mentaliteit"});
    }

    let vorigeStreak=0;
    for(let i=lpVoor.length-1;i>=0;i--){
      if(lpVoor[i].caramboles>0)vorigeStreak++;
      else break;
    }
    const nieuweStreak=car>0?vorigeStreak+1:0;
    if(nieuweStreak===5)items.push({emoji:"⛓️",label:"Reeks zonder poedel",punten:15,categorie:"Consistentie"});
    if(nieuweStreak===8)items.push({emoji:"⛓️",label:"Lange reeks zonder poedel",punten:25,categorie:"Consistentie"});

    return items;
  }

  function noteer(){
    const gemist=Array.from(sel).filter(function(k){return k.startsWith("G__");}).map(function(k){return k.replace("G__","");});
    const goed=Array.from(sel).filter(function(k){return k.startsWith("P__");}).map(function(k){return k.replace("P__","");});
    if(andersGemist.trim())gemist.push(andersGemist.trim());
    if(andersGoed.trim())goed.push(andersGoed.trim());
    const b={id:data.huidigeId,caramboles:car,gemist:gemist,goed:goed,tijd:new Date().toISOString()};
    const nd=Object.assign({},data,{huidigeId:data.huidigeId+1});
    setData(nd);slaOp(nd);
    toonToast(checkLiveBadges(lp,car));
    setLp(function(p){return p.concat([b]);});
    setCar(0);setInp("0");setBeurtNr(function(n){return n+1;});setSel(new Set());setAndersGemist("");setAndersGoed("");setFase("invoer");
  }

  function sluit(){
    if(!lp.length){setConfPartij(false);return;}
    const st=stat(lp);
    const p=Object.assign({id:data.huidigeId,datum:new Date().toISOString(),tafel:tafel,doel:doel,doelType:doelType,discipline:huidigeDiscipline,beurten:lp},st);
    const nieuweAlleP=data.partijen.concat([p]).filter(function(x){return(x.discipline||"libre")===huidigeDiscipline;});
    const resultaten=berekenPrestaties(nieuweAlleP,tijdsvensterMaanden);
    const prestatie=resultaten.find(function(r){return r.id===p.id;});
    const infoVoor=berekenNiveauInfo(alleP);
    const infoNa=berekenNiveauInfo(nieuweAlleP);
    const nieuweDrop=infoNa.aantalDrops>infoVoor.aantalDrops?infoNa.gedroptePartijen[infoNa.gedroptePartijen.length-1]:null;
    const niveauVoor=bepaalNiveau(infoVoor.effectiefGemiddelde,huidigeDiscipline);
    const niveauNa=bepaalNiveau(infoNa.effectiefGemiddelde,huidigeDiscipline);
    const niveauOmhoog=niveauNa.index>niveauVoor.index?{van:niveauVoor.huidig,naar:niveauNa.huidig}:null;
    const nd=Object.assign({},data,{partijen:data.partijen.concat([p]),huidigeId:data.huidigeId+1,laatstGezienNiveauIndex:niveauNa.index});
    setData(nd);slaOp(nd);
    setPartijSamenvatting({partij:p,st:st,prestatie:prestatie,infoNa:infoNa,nieuweDrop:nieuweDrop,niveauOmhoog:niveauOmhoog});
    setLp([]);setBeurtNr(1);setCar(0);setInp("0");setSel(new Set());
    setConfPartij(false);setFase("setup");
  }

  function resetAlles(){
    const overigeDisciplines=data.partijen.filter(function(p){return(p.discipline||"libre")!==huidigeDiscipline;});
    const nd=Object.assign({},data,{partijen:overigeDisciplines});
    setData(nd);slaOp(nd);setLp([]);setBeurtNr(1);setCar(0);setInp("0");
    setSel(new Set());setConfReset(false);setFase("setup");
  }

  function verwijderPartij(id){
    const nd=Object.assign({},data,{partijen:data.partijen.filter(function(p){return p.id!==id;})});
    setData(nd);slaOp(nd);
  }

  function slaNotitieOp(id,tekst){
    const nd=Object.assign({},data,{partijen:data.partijen.map(function(p){
      return p.id===id?Object.assign({},p,{notitie:tekst}):p;
    })});
    setData(nd);slaOp(nd);
  }

  function setTijdsvenster(v){
    const nd=Object.assign({},data,{tijdsvenster:v});
    setData(nd);slaOp(nd);
  }

  function wisselDiscipline(d){
    const nd=Object.assign({},data,{huidigeDiscipline:d});
    setData(nd);slaOp(nd);
  }

  function sluitOnboarding(){
    const nd=Object.assign({},data,{onboardingGezien:true});
    setData(nd);slaOp(nd);
  }

  function deelApp(){
    const url=window.location.href;
    const tekst="Ik gebruik deze Biljart Tracker om mijn carambole-partijen bij te houden — misschien iets voor jou ook?";
    if(navigator.share){
      navigator.share({title:"Biljart Tracker",text:tekst,url:url}).catch(function(){});
    }else if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        setDeelResultaat("Link gekopieerd naar klembord!");
        setTimeout(function(){setDeelResultaat("");},2500);
      }).catch(function(){
        setDeelResultaat("Kopiëren mislukt — kopieer de link handmatig uit de adresbalk.");
      });
    }else{
      setDeelResultaat("Kopieer de link handmatig uit de adresbalk.");
    }
  }

  function seizoenAfsluiten(){
    const huidigeSeizoenen=data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}];
    const nu=new Date().toISOString();
    const bijgewerkt=huidigeSeizoenen.map(function(s){
      return s.eindDatum===null?Object.assign({},s,{eindDatum:nu}):s;
    });
    const nieuwId=Math.max.apply(null,huidigeSeizoenen.map(function(s){return s.id;}))+1;
    bijgewerkt.push({id:nieuwId,naam:"Seizoen "+nieuwId,startDatum:nu,eindDatum:null});
    const nd=Object.assign({},data,{seizoenen:bijgewerkt});
    setData(nd);slaOp(nd);
  }

  function seizoensplitsingOngedaanMaken(){
    const huidigeSeizoenen=data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}];
    if(huidigeSeizoenen.length<2)return;
    const zonderLaatste=huidigeSeizoenen.slice(0,-1);
    const bijgewerkt=zonderLaatste.map(function(s,i){
      return i===zonderLaatste.length-1?Object.assign({},s,{eindDatum:null}):s;
    });
    const nd=Object.assign({},data,{seizoenen:bijgewerkt});
    setData(nd);slaOp(nd);
  }

  function bouwTekst(){
    const stA=stat(alleP.flatMap(function(p){return p.beurten;}));
    const r=["BILJART DATA — "+new Date().toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),"========================================"];
    if(stA)r.push("TOTAAL: "+alleP.length+" partijen · "+stA.totCar+"car · gem "+stA.gemPerBeurt+" · max "+stA.max+" · "+stA.poedels+" poedels");
    var alleOmgekeerd=[].concat(alleP).reverse();
    alleOmgekeerd.forEach(function(p,i){
      const st=stat(p.beurten);
      r.push("");
      r.push("Partij "+(alleP.length-i)+" · "+new Date(p.datum).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})+(p.tafel?" · Tafel "+tafelVol(p.tafel):""));
      if(st)r.push(st.aantalBeurten+"b · max "+st.max+" · gem "+st.gemPerBeurt+" · "+st.poedels+"x poedel · "+st.opbouw5+"x5+");
      p.beurten.forEach(function(b,j){
        const g=(b.gemist||[]).join(", ");
        const gd=(b.goed||[]).join(", ");
        var rule="  B"+(j+1)+": "+b.caramboles+"car"+(b.caramboles===0?" [poedel]":"");
        if(g)rule+=" - Gemist: "+g;
        if(gd)rule+=" - Goed: "+gd;
        r.push(rule);
      });
    });
    return r.join("\n");
  }

  function kopieer(tekst,key){
    var el=document.createElement("textarea");
    el.value=tekst;
    el.setAttribute("readonly","");
    el.style.position="absolute";
    el.style.left="-9999px";
    document.body.appendChild(el);
    el.select();
    document.execCommand("copy");
    document.body.removeChild(el);
    setGekopieerd(key);
    setTimeout(function(){setGekopieerd("");},2500);
  }

              else break;
            }
            const hints=[];
            if(huidigeStreak>0&&huidigeStreak<8){
              if(huidigeStreak<5)hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(5-huidigeStreak)+" tot 15pt)");
              else hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(8-huidigeStreak)+" tot 25pt)");
            }
            if(lp.length>0&&lp[lp.length-1].caramboles===0){
              hints.push("💪 Volgende beurt 5+ car = sterk herstel (+15pt)");
            }
            if(stL){
              const gemNu=parseFloat(stL.gemPerBeurt);
              const basisNu=huidigeRecords.totaalGem!==null?huidigeRecords.totaalGem:0;
              const drempel1Nu=Math.floor(basisNu/0.5)*0.5+0.5;
              const drempel2Nu=drempel1Nu+0.5;
              if(gemNu<drempel2Nu){
                const drempel=gemNu<drempel1Nu?drempel1Nu:drempel2Nu;
                const afstand=drempel-gemNu;
                if(afstand<0.5)hints.push("⭐ Nog "+afstand.toFixed(2)+" tot gemiddelde "+drempel.toFixed(1).replace(".",","));
              }
              if(huidigeRecords.allTimeBestGem>0){
                const afstandRecord=huidigeRecords.allTimeBestGem-gemNu;
                if(afstandRecord>0&&afstandRecord<0.3)hints.push("👑 Nog "+afstandRecord.toFixed(2)+" tot je beste gemiddelde ooit ("+huidigeRecords.allTimeBestGem.toFixed(2)+")");
              }
              const tafelRecord=huidigeRecords.tafelBest[tafel];
              if(tafelRecord&&tafelRecord>0){
                const afstandTafel=tafelRecord-gemNu;
                if(afstandTafel>0&&afstandTafel<0.3)hints.push("🏓 Nog "+afstandTafel.toFixed(2)+" tot je tafelrecord ("+tafelRecord.toFixed(2)+")");
              }
              if(huidigeRecords.totaalGem!==null){
                const afstandTotaal=huidigeRecords.totaalGem-gemNu;
                if(afstandTotaal>0&&afstandTotaal<0.3)hints.push("📊 Nog "+afstandTotaal.toFixed(2)+" tot je totaalgemiddelde ("+huidigeRecords.totaalGem.toFixed(2)+")");
              }
              if(huidigeRecords.rolling5p!==null){
                const afstandRolling=huidigeRecords.rolling5p-gemNu;
                if(afstandRolling>0&&afstandRolling<0.3)hints.push("📉 Nog "+afstandRolling.toFixed(2)+" tot je 5-partij rolling gemiddelde ("+huidigeRecords.rolling5p.toFixed(2)+")");
              }
            }
            if(lp.length>=3){
              const poedelsNu=lp.filter(function(x){return x.caramboles===0;}).length;
              if(poedelsNu===0){
                hints.push("🛡️ Nog 0 poedels in "+lp.length+" beurten, blijf dit volhouden voor +30pt");
              }else{
                const poedelPctNu=poedelsNu/lp.length*100;
                if(poedelPctNu<20)hints.push("✅ "+Math.round(poedelPctNu)+"% poedels tot nu toe (drempel: <20%)");
              }
            }
            if(lp.length>0&&huidigeRecords.allTimeMaxBeurt>0){
              const maxInPartij=Math.max.apply(null,lp.map(function(x){return x.caramboles;}));
              const afstandMax=huidigeRecords.allTimeMaxBeurt-maxInPartij;
              if(afstandMax>0&&afstandMax<=3)hints.push("🏆 Hoogste beurt nu: "+maxInPartij+" car (record: "+huidigeRecords.allTimeMaxBeurt+" car)");
            }
            const helftNu=Math.floor(lp.length/2);
            if(helftNu>=3&&huidigeRecords.totaalGem!==null){
              const eersteNu=lp.slice(0,helftNu),tweedeNu=lp.slice(helftNu);
              const gemENu=eersteNu.reduce(function(a,b){return a+b.caramboles;},0)/eersteNu.length;
              const gemTNu=tweedeNu.reduce(function(a,b){return a+b.caramboles;},0)/tweedeNu.length;
              if(gemTNu>gemENu&&stL&&parseFloat(stL.gemPerBeurt)>huidigeRecords.totaalGem){
                hints.push("📈 Tot nu toe op koers voor sterke afsluiting: 1e helft "+gemENu.toFixed(2)+" · 2e helft "+gemTNu.toFixed(2)+" (schatting, kan nog veranderen)");
              }
            }
            if(doel&&doelType==="caramboles"){
              if(totCarLp<doel)hints.push("🎯 Nog "+(doel-totCarLp)+" caramboles tot je doel");
            }
            if(hints.length===0)return null;
            return(
              <div style={{background:"#182e14",border:"1px solid "+GOUD,borderRadius:8,padding:"7px 10px",marginBottom:6}}>
                {hints.map(function(h,i){return <div key={i} style={{fontSize:13,color:WITD,padding:"2px 0"}}>{h}</div>;})}
              </div>
            );
          })()}

            <div style={{background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"6px 8px"}}>
              <Grafiek beurten={lp}/>
            </div>
          )}
        </div>
      </div>
    );
