          {(function(){
            let huidigeStreak=0;
            for(let i=lp.length-1;i>=0;i--){
              if(lp[i].caramboles>0)huidigeStreak++;
              else break;
            }
            const hints=[];
            if(huidigeStreak>0&&huidigeStreak<8){
              if(huidigeStreak<5)hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(5-huidigeStreak)+" tot 15pt)");
              else hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(8-huidigeStreak)+" tot 25pt)");
            }
            if(lp.length>0&&lp[lp.length-1].caramboles===0){
              hints.push("💪 Volgende beurt "+dInv.opbouwMin+"+ car = sterk herstel (+15pt)");
            }
            if(stL){
              const gemNu=parseFloat(stL.gemPerBeurt);
              const basisNu=huidigeRecords.totaalGem!==null?huidigeRecords.totaalGem:0;
              const drempel1Nu=Math.floor(basisNu/0.5)*0.5+0.5;
              const drempel2Nu=drempel1Nu+0.5;
              if(gemNu<drempel2Nu){
                const drempel=gemNu<drempel1Nu?drempel1Nu:drempel2Nu;
                const afstand=drempel-gemNu;
                if(afstand<0.5)hints.push("⭐ Nog "+afstand.toFixed(2)+" tot gemiddelde "+drempel.toFixed(1).replace(".",","));
              }
              if(huidigeRecords.allTimeBestGem>0){
                const afstandRecord=huidigeRecords.allTimeBestGem-gemNu;
                if(afstandRecord>0&&afstandRecord<0.3)hints.push("👑 Nog "+afstandRecord.toFixed(2)+" tot je beste gemiddelde ooit ("+huidigeRecords.allTimeBestGem.toFixed(2)+")");
              }
              const tafelRecord=huidigeRecords.tafelBest[tafel];
              if(tafelRecord&&tafelRecord>0){
                const afstandTafel=tafelRecord-gemNu;
                if(afstandTafel>0&&afstandTafel<0.3)hints.push("🏓 Nog "+afstandTafel.toFixed(2)+" tot je tafelrecord ("+tafelRecord.toFixed(2)+")");
              }
              if(huidigeRecords.totaalGem!==null){
                const afstandTotaal=huidigeRecords.totaalGem-gemNu;
                if(afstandTotaal>0&&afstandTotaal<0.3)hints.push("📊 Nog "+afstandTotaal.toFixed(2)+" tot je totaalgemiddelde ("+huidigeRecords.totaalGem.toFixed(2)+")");
              }
              if(huidigeRecords.rolling5p!==null){
                const afstandRolling=huidigeRecords.rolling5p-gemNu;
                if(afstandRolling>0&&afstandRolling<0.3)hints.push("📉 Nog "+afstandRolling.toFixed(2)+" tot je 5-partij rolling gemiddelde ("+huidigeRecords.rolling5p.toFixed(2)+")");
              }
            }
            if(lp.length>=3){
              const poedelsNu=lp.filter(function(x){return x.caramboles===0;}).length;
              if(poedelsNu===0){
                hints.push("🛡️ Nog 0 poedels in "+lp.length+" beurten, blijf dit volhouden voor +30pt");
              }else{
                const poedelPctNu=poedelsNu/lp.length*100;
                if(poedelPctNu<20)hints.push("✅ "+Math.round(poedelPctNu)+"% poedels tot nu toe (drempel: <20%)");
              }
            }
            if(lp.length>0&&huidigeRecords.allTimeMaxBeurt>0){
              const maxInPartij=Math.max.apply(null,lp.map(function(x){return x.caramboles;}));
              const afstandMax=huidigeRecords.allTimeMaxBeurt-maxInPartij;
              if(afstandMax>0&&afstandMax<=3)hints.push("🏆 Hoogste beurt nu: "+maxInPartij+" car (record: "+huidigeRecords.allTimeMaxBeurt+" car)");
            }
            const helftNu=Math.floor(lp.length/2);
            if(helftNu>=3&&huidigeRecords.totaalGem!==null){
              const eersteNu=lp.slice(0,helftNu),tweedeNu=lp.slice(helftNu);
              const gemENu=eersteNu.reduce(function(a,b){return a+b.caramboles;},0)/eersteNu.length;
              const gemTNu=tweedeNu.reduce(function(a,b){return a+b.caramboles;},0)/tweedeNu.length;
              if(gemTNu>gemENu&&stL&&parseFloat(stL.gemPerBeurt)>huidigeRecords.totaalGem){
                hints.push("📈 Tot nu toe op koers voor sterke afsluiting: 1e helft "+gemENu.toFixed(2)+" · 2e helft "+gemTNu.toFixed(2)+" (schatting, kan nog veranderen)");
              }
            }
            if(doel&&doelType==="caramboles"){
              if(totCarLp<doel)hints.push("🎯 Nog "+(doel-totCarLp)+" caramboles tot je doel");
            }
            if(hints.length===0)return null;
            return(
              <div style={{background:"#182e14",border:"1px solid "+GOUD,borderRadius:8,padding:"7px 10px",marginBottom:6}}>
                {hints.map(function(h,i){return <div key={i} style={{fontSize:13,color:WITD,padding:"2px 0"}}>{h}</div>;})}
              </div>
            );
          })()}
          {lp.length>1&&(
            <div style={{background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"6px 8px"}}>
              <Grafiek beurten={lp}/>
            </div>
          )}
        </div>
      </div>
    );
  }

            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
              {[["Car.",stA.totCar],["Max",stA.max],["Gem",stA.gemPerBeurt],["Beurten",stA.aantalBeurten],["Poedels",stA.poedels],["Partijen",alleP.length]].map(function(arr){
                return(
                  <div key={arr[0]} style={{textAlign:"center",background:"#1a3019",borderRadius:8,padding:"8px 4px"}}>
                    <div style={{fontSize:22,fontWeight:"bold",color:GOUD}}>{arr[1]}</div>
                    <div style={{fontSize:13,color:WITD}}>{arr[0]}</div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:13,color:GRNT}}>Opbouw: {stA.opbouw5}/{stA.aantalBeurten} beurten {beurtDrempels(huidigeDiscipline).opbouwMin}+</div>
          </div>
        )}
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:8}}>Per partij</div>
          {[].concat(alleP).reverse().map(function(p,i){return <PartijRij key={p.id} p={p} nr={alleP.length-i} prestatie={prestatiesMap[p.id]} gedropt={niveau.gedropteIds&&niveau.gedropteIds.has(p.id)} discipline={huidigeDiscipline} onVerwijder={verwijderPartij} onNotitie={slaNotitieOp}/>;}) }
        </div>
                {!confReset
          ?<button style={{width:"100%",padding:10,background:"none",border:"1px solid #7a3030",borderRadius:8,color:"#e06060",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}
            onClick={function(e){
              const el=statsScrollRef.current;
              const y=el?el.scrollTop:0;
              if(e.currentTarget&&e.currentTarget.blur)e.currentTarget.blur();
              setConfReset(true);
              const herstel=function(){if(el)el.scrollTop=y;};
              requestAnimationFrame(function(){requestAnimationFrame(herstel);});
              setTimeout(herstel,0);
              setTimeout(herstel,50);
              setTimeout(herstel,150);
              setTimeout(herstel,300);
            }}>Alle data wissen</button>
          :<div style={{background:"#2a1515",border:"1px solid #7a3030",borderRadius:8,padding:"12px 14px"}}>
            <div style={{fontSize:14,color:"#e06060",marginBottom:10}}>Weet je het zeker?</div>
            <div style={{display:"flex",gap:8}}>
              <button style={{flex:1,padding:10,background:"#7a3030",border:"none",borderRadius:6,color:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={resetAlles}>Ja, wis alles</button>
              <button style={{flex:1,padding:10,background:"none",border:"1px solid "+KBDR,borderRadius:6,color:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={function(){setConfReset(false);}}>Annuleer</button>
            </div>
          </div>}

          <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:6}}>Over deze app</div>
            <div style={{fontSize:13,color:WITD,marginBottom:10,lineHeight:1.5}}>
              Biljart Tracker houdt je carambole-partijen bij (Libre, Driebanden, Bandstoten) met een niveausysteem op basis van de echte KNBB-klassen, plus badges en mijlpalen om je voortgang leuk te houden. Al je data blijft alleen op dit toestel staan.
            </div>
            <button onClick={deelApp} style={{width:"100%",padding:11,background:"linear-gradient(135deg,"+GOUD+","+GOUDL+")",border:"none",borderRadius:8,color:G,fontWeight:"bold",cursor:"pointer",fontSize:14,fontFamily:"inherit",marginBottom:8}}>
              📤 Deel deze app
            </button>
            {deelResultaat&&<div style={{textAlign:"center",fontSize:12,color:GRNT}}>{deelResultaat}</div>}
          </div>
      </div>
    );
  }

  // ── DATA ──
  function Data(){
    const dataTekst=bouwTekst();
    const promptPartij="Je bent een biljartcoach voor carambole/libre. Analyseer mijn meest recente partij. Geef: Wat ging goed, Grootste rem, Foutpatronen, Trainingsadvies, Focus. Antwoord beknopt.\n\n"+dataTekst;
    const promptTrend="Je bent een biljartcoach voor carambole/libre. Analyseer mijn trends over al mijn partijen. Geef: Trend, Vooruitgang, Remmers, Inzicht, Trainingsfocus. Antwoord beknopt.\n\n"+dataTekst;
    return(
      <div style={{overflowY:"auto",padding:"12px 14px",height:"100%"}}>
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:6}}>AI Analyse</div>
          <div style={{fontSize:13,color:WITD,marginBottom:10,lineHeight:1.5}}>
            Kopieer een kant-en-klare prompt met al je data erin, en plak die in ChatGPT, Claude of een andere AI-chat voor een persoonlijke analyse.
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}
              onClick={function(){kopieer(promptPartij,"aipartij");}}>{gekopieerd==="aipartij"?"Gekopieerd!":"📋 Partij-analyse-prompt"}</button>
            <button style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}
              onClick={function(){kopieer(promptTrend,"aitrend");}}>{gekopieerd==="aitrend"?"Gekopieerd!":"📋 Trend-analyse-prompt"}</button>
          </div>
        </div>
        <button style={{width:"100%",padding:14,background:"linear-gradient(135deg,"+GOUD+","+GOUDL+")",border:"none",borderRadius:10,color:G,fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit",marginBottom:12}}
          onClick={function(){kopieer(dataTekst,"data");setToonData(function(v){return !v;});}}>
          {gekopieerd==="data"?"Gekopieerd!":"Kopieer data"}
        </button>
        {toonData&&(
          <div>
            <div style={{fontSize:13,color:WITD,marginBottom:6}}>Selecteer alles hieronder en kopieer:</div>
            <textarea readOnly value={dataTekst}
              onClick={function(e){e.target.select();}}
              style={{width:"100%",height:220,background:"#0d1f0d",border:"1px solid "+KBDR,borderRadius:8,color:WITD,fontSize:13,padding:8,fontFamily:"monospace",resize:"none"}}/>
          </div>
        )}
      </div>
    );
  }

  // ── LOG ──
  function Log(){
    return(
      <div style={{overflowY:"auto",padding:"12px 14px",height:"100%"}}>
        {lp.length>0&&(
          <div style={{background:KBG,border:"2px solid "+GOUD,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:8}}>Lopende partij</div>
            {[].concat(lp).reverse().map(function(b,i){return <LogRij key={b.id} b={b} nr={lp.length-i}/>;}) }
          </div>
        )}
        {[].concat(alleP).reverse().map(function(p,pi){
          return <LogPartijRij key={p.id} p={p} nr={alleP.length-pi} prestatie={prestatiesMap[p.id]} gedropt={niveau.gedropteIds&&niveau.gedropteIds.has(p.id)} discipline={huidigeDiscipline} onVerwijder={verwijderPartij} onNotitie={slaNotitieOp}/>;
        })}
      </div>
    );
  }

            <div style={{fontSize:12,color:WITD,letterSpacing:2,textTransform:"uppercase"}}>Carambole - Serie registratie</div>

        </div>

      {seizoenArchiefOpen&&<SeizoenArchief seizoenen={data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}]} alleP={alleP} discipline={huidigeDiscipline} onClose={function(){setSeizoenArchiefOpen(false);}}/>}

                <div style={{fontSize:13,color:WITD}}>{niveauUpInfo.van.naam}</div>
              </div>
              <div style={{fontSize:22,color:niveauUpInfo.naar.kleur}}>→</div>

                <div style={{width:64,height:64,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,"+niveauUpInfo.naar.kleur+"ee,"+niveauUpInfo.naar.kleur+"55)",border:"3px solid "+niveauUpInfo.naar.kleur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,boxShadow:"0 0 22px "+niveauUpInfo.naar.kleur+"aa",margin:"0 auto 6px"}}>

                </div>
                <div style={{fontSize:14,fontWeight:"bold",color:niveauUpInfo.naar.kleur}}>{niveauUpInfo.naar.naam}</div>
              </div>

            <div style={{fontSize:14,color:WITD,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Prestatie behaald!</div>

                return(
                  <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",width:88}}>
                    <div style={{width:66,height:66,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,"+kleur+"dd,"+kleur+"44)",border:"3px solid "+kleur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,boxShadow:"0 0 18px "+kleur+"99",marginBottom:6}}>
                      {b.emoji}

                    <div style={{fontSize:14,color:kleur,fontWeight:"bold"}}>+{b.punten}</div>

              })}
            </div>

        })}

          return(
            <button onClick={function(){setKaderKiezerOpen(true);}}
              style={{flex:1,padding:"6px 0",background:kaderActief?"#2d4a1e":"none",border:"1px solid "+(kaderActief?GOUD:KBDR),borderRadius:8,color:kaderActief?GOUD:WITD,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>

            </button>
          );
        })()}

          <div onClick={function(e){e.stopPropagation();}} style={{background:"linear-gradient(160deg,#1e3a1e,#0d1f0d)",border:"2px solid "+GOUD,borderRadius:16,padding:"18px 16px",maxWidth:340,width:"100%"}}>
            <div style={{fontSize:16,fontWeight:"bold",color:GOUD,marginBottom:4,textAlign:"center"}}>Kies je kader-variant</div>
            <div style={{fontSize:12,color:WITD,textAlign:"center",marginBottom:14}}>Elke variant heeft zijn eigen gemiddelde en niveau, los van de andere</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {KADER_VARIANTEN.map(function(k){
                const actief=huidigeDiscipline===k;
                return(
                  <button key={k} onClick={function(){wisselDiscipline(k);setKaderKiezerOpen(false);}}
                    style={{padding:"12px 10px",background:actief?"#2d4a1e":"none",border:"1px solid "+(actief?GOUD:KBDR),borderRadius:10,color:actief?GOUD:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:15,textAlign:"left"}}>
                    {DISCIPLINES[k].naam}
                  </button>
                );
              })}
            </div>
            <div onClick={function(){setKaderKiezerOpen(false);}} style={{textAlign:"center",marginTop:14,fontSize:12,color:WITD,opacity:0.7,cursor:"pointer"}}>Tik om te sluiten</div>
          </div>
        </div>
      )}

      <div style={{display:"flex",borderBottom:"1px solid "+KBDR,background:"#152015",flexShrink:0}}>
        {[["spelen","Spelen"],["stats","Stats"],["dash","Dash"],["log","Log"],["data","Data"]].map(function(arr){

          const actief=tab===arr[0];
          return <button key={arr[0]} style={{flex:1,padding:"11px 0",background:actief?"#1c2c1c":(isDash?"rgba(201,168,76,0.06)":"none"),border:"none",color:actief?GOUD:(isDash?GOUDL:WITD),fontSize:isDash?15:14,fontWeight:isDash?"bold":"normal",cursor:"pointer",fontFamily:"inherit",borderBottom:actief?"2px solid "+GOUD:(isDash?"2px solid "+"#7a6a3a":"2px solid transparent")}}

            {fase==="goed"&&<Goed/>}

        {tab==="data"&&<Data/>}
        {tab==="log"&&<Log/>}
        {tab==="dash"&&<Dashboard partijen={alleP} niveau={niveau} tijdsvensterMaanden={tijdsvensterMaanden} discipline={huidigeDiscipline}/>}
