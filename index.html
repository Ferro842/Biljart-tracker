            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
              {[["Car.",stA.totCar],["Max",stA.max],["Gem",stA.gemPerBeurt],["Beurten",stA.aantalBeurten],["Poedels",stA.poedels],["Partijen",alleP.length]].map(function(arr){
                return(
                  <div key={arr[0]} style={{textAlign:"center",background:"#1a3019",borderRadius:8,padding:"8px 4px"}}>
                    <div style={{fontSize:22,fontWeight:"bold",color:GOUD}}>{arr[1]}</div>
                    <div style={{fontSize:13,color:WITD}}>{arr[0]}</div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:13,color:GRNT}}>Opbouw: {stA.opbouw5}/{stA.aantalBeurten} beurten {beurtDrempels(huidigeDiscipline).opbouwMin}+</div>
          </div>
        )}
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:8}}>Per partij</div>
          {[].concat(alleP).reverse().map(function(p,i){return <PartijRij key={p.id} p={p} nr={alleP.length-i} prestatie={prestatiesMap[p.id]} gedropt={niveau.gedropteIds&&niveau.gedropteIds.has(p.id)} discipline={huidigeDiscipline} onVerwijder={verwijderPartij} onNotitie={slaNotitieOp}/>;}) }
        </div>
                {!confReset
          ?<button style={{width:"100%",padding:10,background:"none",border:"1px solid #7a3030",borderRadius:8,color:"#e06060",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}
            onClick={function(e){
              const el=statsScrollRef.current;
              const y=el?el.scrollTop:0;
              if(e.currentTarget&&e.currentTarget.blur)e.currentTarget.blur();
              setConfReset(true);
              const herstel=function(){if(el)el.scrollTop=y;};
              requestAnimationFrame(function(){requestAnimationFrame(herstel);});
              setTimeout(herstel,0);
              setTimeout(herstel,50);
              setTimeout(herstel,150);
              setTimeout(herstel,300);
            }}>Alle data wissen</button>
          :<div style={{background:"#2a1515",border:"1px solid #7a3030",borderRadius:8,padding:"12px 14px"}}>
            <div style={{fontSize:14,color:"#e06060",marginBottom:10}}>Weet je het zeker?</div>
            <div style={{display:"flex",gap:8}}>
              <button style={{flex:1,padding:10,background:"#7a3030",border:"none",borderRadius:6,color:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={resetAlles}>Ja, wis alles</button>
              <button style={{flex:1,padding:10,background:"none",border:"1px solid "+KBDR,borderRadius:6,color:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={function(){setConfReset(false);}}>Annuleer</button>
            </div>
          </div>}

          <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:6}}>Over deze app</div>
            <div style={{fontSize:13,color:WITD,marginBottom:10,lineHeight:1.5}}>
              Biljart Tracker houdt je carambole-partijen bij (Libre, Driebanden, Bandstoten en Kader) met een niveausysteem op basis van de echte KNBB-klassen, plus badges en mijlpalen om je voortgang leuk te houden. Al je data blijft alleen op dit toestel staan.
            </div>
            <button onClick={deelApp} style={{width:"100%",padding:11,background:"linear-gradient(135deg,"+GOUD+","+GOUDL+")",border:"none",borderRadius:8,color:G,fontWeight:"bold",cursor:"pointer",fontSize:14,fontFamily:"inherit",marginBottom:8}}>
              📤 Deel deze app
            </button>
            {deelResultaat&&<div style={{textAlign:"center",fontSize:12,color:GRNT}}>{deelResultaat}</div>}
            <div style={{textAlign:"center",fontSize:11,color:WITD,opacity:0.6,marginTop:4}}>
              Versie {APP_VERSIE} · <a href={WEB_URL+"privacy.html"} target="_blank" rel="noopener" style={{color:WITD}}>Privacybeleid</a>
            </div>
          </div>
      </div>
    );
  }

  // ── DATA ──
  function Data(){
    const dataTekst=bouwTekst();
    const promptPartij="Je bent een biljartcoach voor carambole/libre. Analyseer mijn meest recente partij. Geef: Wat ging goed, Grootste rem, Foutpatronen, Trainingsadvies, Focus. Antwoord beknopt.\n\n"+dataTekst;
    const promptTrend="Je bent een biljartcoach voor carambole/libre. Analyseer mijn trends over al mijn partijen. Geef: Trend, Vooruitgang, Remmers, Inzicht, Trainingsfocus. Antwoord beknopt.\n\n"+dataTekst;
    return(
      <div style={{overflowY:"auto",padding:"12px 14px",height:"100%"}}>
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:6}}>AI Analyse</div>
          <div style={{fontSize:13,color:WITD,marginBottom:10,lineHeight:1.5}}>
            Kopieer een kant-en-klare prompt met al je data erin, en plak die in ChatGPT, Claude of een andere AI-chat voor een persoonlijke analyse.
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}
              onClick={function(){kopieer(promptPartij,"aipartij");}}>{gekopieerd==="aipartij"?"Gekopieerd!":"📋 Partij-analyse-prompt"}</button>
            <button style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}
              onClick={function(){kopieer(promptTrend,"aitrend");}}>{gekopieerd==="aitrend"?"Gekopieerd!":"📋 Trend-analyse-prompt"}</button>
          </div>
        </div>
        <button style={{width:"100%",padding:14,background:"linear-gradient(135deg,"+GOUD+","+GOUDL+")",border:"none",borderRadius:10,color:G,fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit",marginBottom:12}}
          onClick={function(){kopieer(dataTekst,"data");setToonData(function(v){return !v;});}}>
          {gekopieerd==="data"?"Gekopieerd!":"Kopieer data"}
        </button>
        {toonData&&(
          <div>
            <div style={{fontSize:13,color:WITD,marginBottom:6}}>Selecteer alles hieronder en kopieer:</div>
            <textarea readOnly value={dataTekst}
              onClick={function(e){e.target.select();}}
              style={{width:"100%",height:220,background:"#0d1f0d",border:"1px solid "+KBDR,borderRadius:8,color:WITD,fontSize:13,padding:8,fontFamily:"monospace",resize:"none"}}/>
          </div>
        )}
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px",marginTop:12}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:6}}>Back-up</div>
          <div style={{fontSize:13,color:WITD,marginBottom:10,lineHeight:1.5}}>
            Sla al je data op als bestand, of zet een eerder bestand terug.
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}
              onClick={exporteerData}>📤 Exporteer data</button>
            <label style={{flex:1,padding:12,background:"none",border:"1px solid "+GOUD,borderRadius:8,color:GOUD,fontSize:14,cursor:"pointer",fontFamily:"inherit",textAlign:"center",boxSizing:"border-box"}}>
              📥 Importeer data
              <input type="file" accept=".json,application/json" onChange={importeerData} style={{display:"none"}}/>
            </label>
          </div>
        </div>
      </div>
    );
  }

  // ── LOG ──
  function Log(){
    return(
      <div style={{overflowY:"auto",padding:"12px 14px",height:"100%"}}>
        {lp.length>0&&(
          <div style={{background:KBG,border:"2px solid "+GOUD,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:GOUD,marginBottom:8}}>Lopende partij</div>
            {[].concat(lp).reverse().map(function(b,i){return <LogRij key={b.id} b={b} nr={lp.length-i}/>;}) }
          </div>
        )}
        {[].concat(alleP).reverse().map(function(p,pi){
          return <LogPartijRij key={p.id} p={p} nr={alleP.length-pi} prestatie={prestatiesMap[p.id]} gedropt={niveau.gedropteIds&&niveau.gedropteIds.has(p.id)} discipline={huidigeDiscipline} onVerwijder={verwijderPartij} onNotitie={slaNotitieOp}/>;
        })}
      </div>
    );
  }

  const LOGO_URL="logo.png";

  return(
    <div className="app">
      <div style={{background:"linear-gradient(135deg,#0d1f0d,#1a2e1a)",borderBottom:"2px solid "+GOUD,padding:"9px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <img src={LOGO_URL} alt="Biljart Tracker" style={{width:44,height:44,borderRadius:10,flexShrink:0}}/>
          <div>
            <div style={{fontSize:16,fontWeight:"bold",color:GOUD,letterSpacing:1}}>Biljart Tracker</div>
            <div style={{fontSize:12,color:WITD,letterSpacing:2,textTransform:"uppercase"}}>Carambole - Serie registratie</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={function(){setNiveauOpen(true);}} style={{display:"flex",alignItems:"center",gap:4,background:"rgba(0,0,0,0.25)",border:"1px solid "+niveau.huidig.kleur,borderRadius:20,padding:"4px 10px 4px 6px",cursor:"pointer",fontFamily:"inherit"}}>
            <span style={{fontSize:14}}>{niveau.huidig.emoji}</span>
            <span style={{fontSize:13,fontWeight:"bold",color:niveau.huidig.kleur}}>{niveau.huidig.naam}</span>
          </button>
          {fase!=="setup"&&lp.length>0&&(
            <button style={{background:"none",border:"1px solid "+KBDR,borderRadius:8,color:WITD,padding:"5px 10px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}
              onClick={function(){setConfPartij(true);}}>Afsluiten</button>
          )}
        </div>
      </div>

      {!data.onboardingGezien&&<WelkomstFlow stap={onboardingStap} setStap={setOnboardingStap} discipline={huidigeDiscipline} wisselDiscipline={wisselDiscipline} onKlaar={sluitOnboarding}/>}

      {niveauOpen&&<NiveauOverzicht niveau={niveau} discipline={huidigeDiscipline} onClose={function(){setNiveauOpen(false);}}/>}

      {seizoenArchiefOpen&&<SeizoenArchief seizoenen={data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}]} alleP={alleP} discipline={huidigeDiscipline} onClose={function(){setSeizoenArchiefOpen(false);}}/>}

      {partijSamenvatting&&<PartijSamenvatting partij={partijSamenvatting.partij} st={partijSamenvatting.st} prestatie={partijSamenvatting.prestatie} infoNa={partijSamenvatting.infoNa} nieuweDrop={partijSamenvatting.nieuweDrop} niveauOmhoog={partijSamenvatting.niveauOmhoog} discipline={huidigeDiscipline} onClose={function(){setPartijSamenvatting(null);}}/>}

      {niveauUpInfo&&(
        <div onClick={function(){setNiveauUpInfo(null);}}
          style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"pointer"}}>
          <div style={{background:"linear-gradient(160deg,#2a4a1e,#0d1f0d)",border:"3px solid "+niveauUpInfo.naar.kleur,borderRadius:22,padding:"28px 22px",maxWidth:360,width:"100%",textAlign:"center",boxShadow:"0 0 60px "+niveauUpInfo.naar.kleur+"66, 0 10px 44px rgba(0,0,0,0.7)",animation:"badgePopIn 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <div style={{fontSize:15,color:WITD,textTransform:"uppercase",letterSpacing:3,marginBottom:10}}>Niveau omhoog!</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:14}}>
              <div style={{textAlign:"center",opacity:0.5}}>
                <div style={{fontSize:30}}>{niveauUpInfo.van.emoji}</div>
                <div style={{fontSize:13,color:WITD}}>{niveauUpInfo.van.naam}</div>
              </div>
              <div style={{fontSize:22,color:niveauUpInfo.naar.kleur}}>→</div>
              <div style={{textAlign:"center"}}>
                <div style={{width:64,height:64,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,"+niveauUpInfo.naar.kleur+"ee,"+niveauUpInfo.naar.kleur+"55)",border:"3px solid "+niveauUpInfo.naar.kleur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,boxShadow:"0 0 22px "+niveauUpInfo.naar.kleur+"aa",margin:"0 auto 6px"}}>
                  {niveauUpInfo.naar.emoji}
                </div>
                <div style={{fontSize:14,fontWeight:"bold",color:niveauUpInfo.naar.kleur}}>{niveauUpInfo.naar.naam}</div>
              </div>
            </div>
            <div style={{fontSize:13,color:WITD,opacity:0.85}}>Je gemiddelde heeft de {niveauUpInfo.naar.gemDrempel.toFixed(1)}-drempel gehaald</div>
            <div style={{fontSize:13,color:WITD,marginTop:16,opacity:0.7}}>Tik om te sluiten</div>
          </div>
        </div>
      )}

      {toastGroep&&(
        <div onClick={function(){setToastGroep(null);}}
          style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"pointer"}}>
          <div style={{background:"linear-gradient(160deg,#1e3a1e,#0d1f0d)",border:"2px solid "+GOUD,borderRadius:20,padding:"24px 20px 18px",maxWidth:360,width:"100%",textAlign:"center",boxShadow:"0 10px 44px rgba(0,0,0,0.6)",animation:"badgePopIn 0.4s cubic-bezier(0.34,1.56,0.64,1)"}}>
            <div style={{fontSize:14,color:WITD,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Prestatie behaald!</div>
            <div style={{fontSize:36,fontWeight:"bold",color:GOUD,marginBottom:18,textShadow:"0 0 20px rgba(201,168,76,0.5)"}}>+{toastGroep.reduce(function(a,b){return a+b.punten;},0)}pt</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:14,justifyContent:"center"}}>
              {toastGroep.map(function(b,i){
                const kleur=categorieKleur(b.categorie);
                return(
                  <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",width:88}}>
                    <div style={{width:66,height:66,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,"+kleur+"dd,"+kleur+"44)",border:"3px solid "+kleur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,boxShadow:"0 0 18px "+kleur+"99",marginBottom:6}}>
                      {b.emoji}
                    </div>
                    <div style={{fontSize:13,color:WIT,fontWeight:"bold",lineHeight:1.25}}>{b.label}</div>
                    <div style={{fontSize:14,color:kleur,fontWeight:"bold"}}>+{b.punten}</div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:13,color:WITD,marginTop:20,opacity:0.7}}>Tik om te sluiten</div>
          </div>
        </div>
      )}

      {confPartij&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}>
          <div style={{background:"#1a2e1a",border:"2px solid "+GOUD,borderRadius:14,padding:24,maxWidth:320,width:"100%"}}>
            <div style={{fontSize:15,color:WIT,marginBottom:6,textAlign:"center"}}>Partij opslaan?</div>
            <div style={{fontSize:14,color:WITD,marginBottom:18,textAlign:"center"}}>{lp.length} beurten - {totCarLp} car{stL?" - gem "+stL.gemPerBeurt:""}</div>
            <div style={{display:"flex",gap:10}}>
              <button style={{flex:1,padding:14,background:GRNT,border:"none",borderRadius:8,color:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={sluit}>Opslaan</button>
              <button style={{flex:1,padding:14,background:"none",border:"1px solid "+KBDR,borderRadius:8,color:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:14}} onClick={function(){setConfPartij(false);}}>Annuleer</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:6,padding:"8px 14px",background:"#152015",borderBottom:"1px solid "+KBDR,flexShrink:0}}>
        {HOOFDDISCIPLINES.map(function(d){
          return(
            <button key={d} onClick={function(){wisselDiscipline(d);}}
              style={{flex:1,padding:"6px 0",background:huidigeDiscipline===d?"#2d4a1e":"none",border:"1px solid "+(huidigeDiscipline===d?GOUD:KBDR),borderRadius:8,color:huidigeDiscipline===d?GOUD:WITD,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              {DISCIPLINES[d].naam}
            </button>
          );
        })}
        {(function(){
          const kaderActief=KADER_VARIANTEN.indexOf(huidigeDiscipline)!==-1;
          return(
            <button onClick={function(){setKaderKiezerOpen(true);}}
              style={{flex:1,padding:"6px 0",background:kaderActief?"#2d4a1e":"none",border:"1px solid "+(kaderActief?GOUD:KBDR),borderRadius:8,color:kaderActief?GOUD:WITD,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              {kaderActief?DISCIPLINES[huidigeDiscipline].naam:"Kader"}
            </button>
          );
        })()}
      </div>
      {kaderKiezerOpen&&(
        <div onClick={function(){setKaderKiezerOpen(false);}} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"pointer"}}>
          <div onClick={function(e){e.stopPropagation();}} style={{background:"linear-gradient(160deg,#1e3a1e,#0d1f0d)",border:"2px solid "+GOUD,borderRadius:16,padding:"18px 16px",maxWidth:340,width:"100%"}}>
            <div style={{fontSize:16,fontWeight:"bold",color:GOUD,marginBottom:4,textAlign:"center"}}>Kies je kader-variant</div>
            <div style={{fontSize:12,color:WITD,textAlign:"center",marginBottom:14}}>Elke variant heeft zijn eigen gemiddelde en niveau, los van de andere</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {KADER_VARIANTEN.map(function(k){
                const actief=huidigeDiscipline===k;
                return(
                  <button key={k} onClick={function(){wisselDiscipline(k);setKaderKiezerOpen(false);}}
                    style={{padding:"12px 10px",background:actief?"#2d4a1e":"none",border:"1px solid "+(actief?GOUD:KBDR),borderRadius:10,color:actief?GOUD:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:15,textAlign:"left"}}>
                    {DISCIPLINES[k].naam}
                  </button>
                );
              })}
            </div>
            <div onClick={function(){setKaderKiezerOpen(false);}} style={{textAlign:"center",marginTop:14,fontSize:12,color:WITD,opacity:0.7,cursor:"pointer"}}>Tik om te sluiten</div>
          </div>
        </div>
      )}

      <div style={{display:"flex",borderBottom:"1px solid "+KBDR,background:"#152015",flexShrink:0}}>
        {[["spelen","Spelen"],["stats","Stats"],["dash","Dash"],["log","Log"],["data","Data"]].map(function(arr){
          return <button key={arr[0]} style={{flex:1,padding:"11px 0",background:tab===arr[0]?"#1c2c1c":"none",border:"none",color:tab===arr[0]?GOUD:WITD,fontSize:14,cursor:"pointer",fontFamily:"inherit",borderBottom:tab===arr[0]?"2px solid "+GOUD:"2px solid transparent"}}
            onClick={function(){setTab(arr[0]);}}>{arr[1]}</button>;
        })}
      </div>

      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {tab==="spelen"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {/* Deze schermen staan binnen BiljartTracker en worden daarom als gewone functie aangeroepen,
                niet als <Component/>: anders ziet React ze bij elke render als nieuw component, verliest een
                invoerveld na elke letter de focus en springt de scrollpositie terug. Geen hooks in deze functies. */}
            {fase==="setup"&&Setup()}
            {fase==="invoer"&&Invoer()}
            {fase==="gemist"&&Gemist()}
            {fase==="goed"&&Goed()}
          </div>
        )}
        {tab==="stats"&&Stats()}
        {tab==="data"&&Data()}
        {tab==="log"&&Log()}
        {tab==="dash"&&<Dashboard partijen={alleP} niveau={niveau} tijdsvensterMaanden={tijdsvensterMaanden} discipline={huidigeDiscipline}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BiljartTracker,null));
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
