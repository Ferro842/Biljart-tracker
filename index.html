<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biljart Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biljart">
<meta name="theme-color" content="#1a2e1a">
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<script>
// Alleen in de native iOS-app (Capacitor): tot in de randen tekenen en de safe area zelf opvangen.
// In Safari en als beginscherm-PWA bestaat window.Capacitor niet en verandert er niets.
if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){
  document.documentElement.classList.add("native");
  var vp=document.querySelector('meta[name=viewport]');
  if(vp)vp.content+=", viewport-fit=cover";
}
</script>
<!-- React 18.2.0 en Babel 7.23.2 staan lokaal in vendor/ (identiek aan cdnjs), zodat de app zonder internet start -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<link rel="stylesheet" href="css/app.css?v=2026-10-14.11">
</head>
<body>
<div id="root"></div>
<script src="js/constanten.js?v=2026-10-14.11"></script>
<script src="js/berekeningen.js?v=2026-10-14.11"></script>
<script src="js/opslag.js?v=2026-10-14.11"></script>
<script type="text/babel" src="jsx/onderdelen.jsx?v=2026-10-14.11"></script>
<script type="text/babel" src="jsx/vensters.jsx?v=2026-10-14.11"></script>
<script type="text/babel" src="jsx/partijrij.jsx?v=2026-10-14.11"></script>
<script type="text/babel" src="jsx/dashboard.jsx?v=2026-10-14.11"></script>
<script type="text/babel" src="jsx/tabs.jsx?v=2026-10-14.11"></script>
<script type="text/babel">
// Ophogen bij elke wijziging: staat onderaan de Stats-tab, zo zie je op de telefoon welke versie geladen is
const APP_VERSIE="2026-10-14.11";

function BiljartTracker(){
  const [data,setData]=useState(null);
  const [tab,setTab]=useState("spelen");
  const [car,setCar]=useState(0);
  const [inp,setInp]=useState("0");
  const [beurtNr,setBeurtNr]=useState(1);
  const [sel,setSel]=useState(new Set());
  const [andersGemist,setAndersGemist]=useState("");
  const [andersGoed,setAndersGoed]=useState("");
  const [fase,setFase]=useState("setup");
  const [lp,setLp]=useState([]);
  const [doel,setDoel]=useState(25);
  const [doelType,setDoelType]=useState("beurten");
  const [tafel,setTafel]=useState("210");
  const [confPartij,setConfPartij]=useState(false);
  const [seizoenArchiefOpen,setSeizoenArchiefOpen]=useState(false);
  const [onboardingStap,setOnboardingStap]=useState(0);
  const [kaderKiezerOpen,setKaderKiezerOpen]=useState(false);
  const inputRef=useRef(null);
  const [toastGroep,setToastGroep]=useState(null);
  const [niveauOpen,setNiveauOpen]=useState(false);
  const [partijSamenvatting,setPartijSamenvatting]=useState(null);
  const [niveauUpInfo,setNiveauUpInfo]=useState(null);

  const tijdsvenster=(data&&data.tijdsvenster)||"alles";
  const tijdsvensterMaanden=tijdsvenster==="alles"?null:parseInt(tijdsvenster,10);
  const huidigeDiscplineVoorLading=(data&&data.huidigeDiscipline)||"libre";

  const alleP=useMemo(function(){
    if(!data)return[];
    return data.partijen.filter(function(p){return(p.discipline||"libre")===huidigeDiscplineVoorLading;});
  },[data,huidigeDiscplineVoorLading]);

  const prestatiesMap=useMemo(function(){
    const arr=berekenPrestaties(alleP,tijdsvensterMaanden,huidigeDiscplineVoorLading);
    const m={};
    arr.forEach(function(r){m[r.id]=r;});
    return m;
  },[alleP,tijdsvensterMaanden]);
  const huidigeRecords=useMemo(function(){
    return berekenLopendeRecords(alleP,tijdsvensterMaanden);
  },[alleP,tijdsvensterMaanden]);
  const niveau=useMemo(function(){
    // Niveau gebruikt altijd all-time data binnen de huidige discipline (los van de tijdsvenster-
    // instelling hierboven, die alleen de ⭐-drempels en 👑🏓-records beïnvloedt).
    const info=berekenNiveauInfo(alleP);
    const voorspelling=berekenVoorspelling(alleP,huidigeDiscplineVoorLading);
    let aantalPartijen=0;
    alleP.forEach(function(p){
      if(stat(p.beurten))aantalPartijen++;
    });
    return Object.assign({},bepaalNiveau(info.effectiefGemiddelde,huidigeDiscplineVoorLading),{
      totaalGemiddelde:info.totaalGemiddelde,
      effectiefGemiddelde:info.effectiefGemiddelde,
      badgePunten:info.badgePunten,
      aantalDrops:info.aantalDrops,
      gedropteIds:info.gedropteIds,
      gedroptePartijen:info.gedroptePartijen,
      volgendeKandidaatId:info.volgendeKandidaatId,
      volgendeKandidaatGem:info.volgendeKandidaatGem,
      puntenTotVolgendeDrop:info.puntenTotVolgendeDrop,
      voorspelling:voorspelling,
      aantalPartijen:aantalPartijen
    });
  },[alleP,huidigeDiscplineVoorLading]);

  useEffect(function(){
    if(!data)return;
    if(data.laatstGezienNiveauIndex===undefined){
      const nd=Object.assign({},data,{laatstGezienNiveauIndex:niveau.index});
      setData(nd);slaOp(nd);
      return;
    }
    if(niveau.index>data.laatstGezienNiveauIndex){
      const niveaus=(DISCIPLINES[huidigeDiscplineVoorLading]||DISCIPLINES.libre).niveaus;
      setNiveauUpInfo({van:niveaus[data.laatstGezienNiveauIndex],naar:niveau.huidig});
      const nd=Object.assign({},data,{laatstGezienNiveauIndex:niveau.index});
      setData(nd);slaOp(nd);
    }
  },[niveau.index]);

  useEffect(function(){laadData().then(setData);},[]);
  if(!data)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:GOUD,fontSize:18,background:G}}>Laden...</div>;

  const huidigeDiscipline=huidigeDiscplineVoorLading;
  const stL=stat(lp,huidigeDiscipline);
  const totCarLp=lp.reduce(function(a,b){return a+b.caramboles;},0);
  const voortgang=doelType==="beurten"?lp.length:totCarLp;
  const progPct=Math.min(100,Math.round(voortgang/doel*100));

  function toggle(key){setSel(function(prev){const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});}

  function toonToast(items){
    if(items&&items.length)setToastGroep(items);
  }

  function checkLiveBadges(lpVoor,car){
    const dLive=beurtDrempels(huidigeDiscipline);
    const items=[];
    if(car>=dLive.opbouwMin&&car<=dLive.opbouwMax)items.push({emoji:"🎯",label:"Opbouw",punten:10,categorie:"Beurt-pieken"});
    else if(car>=dLive.sterkMin&&car<=dLive.sterkMax)items.push({emoji:"🔥",label:"Sterke serie",punten:20,categorie:"Beurt-pieken"});
    else if(car>=dLive.topMin)items.push({emoji:"💫",label:"Topserie",punten:35,categorie:"Beurt-pieken"});

    const maxInPartijVoor=lpVoor.length?Math.max.apply(null,lpVoor.map(function(x){return x.caramboles;})):0;
    if(car>huidigeRecords.allTimeMaxBeurt&&huidigeRecords.allTimeMaxBeurt>0&&car>maxInPartijVoor){
      items.push({emoji:"🏆",label:"Nieuw record beurt!",punten:50,categorie:"Beurt-pieken"});
    }

    if(lpVoor.length>0&&lpVoor[lpVoor.length-1].caramboles===0&&car>=dLive.opbouwMin){
      items.push({emoji:"💪",label:"Sterk herstel na poedel",punten:15,categorie:"Mentaliteit"});
    }

    let vorigeStreak=0;
    for(let i=lpVoor.length-1;i>=0;i--){
      if(lpVoor[i].caramboles>0)vorigeStreak++;
      else break;
    }
    const nieuweStreak=car>0?vorigeStreak+1:0;
    if(nieuweStreak===5)items.push({emoji:"⛓️",label:"Reeks zonder poedel",punten:15,categorie:"Consistentie"});
    if(nieuweStreak===8)items.push({emoji:"⛓️",label:"Lange reeks zonder poedel",punten:25,categorie:"Consistentie"});

    return items;
  }

  function noteer(){
    const gemist=Array.from(sel).filter(function(k){return k.startsWith("G__");}).map(function(k){return k.replace("G__","");});
    const goed=Array.from(sel).filter(function(k){return k.startsWith("P__");}).map(function(k){return k.replace("P__","");});
    if(andersGemist.trim())gemist.push(andersGemist.trim());
    if(andersGoed.trim())goed.push(andersGoed.trim());
    const b={id:data.huidigeId,caramboles:car,gemist:gemist,goed:goed,tijd:new Date().toISOString()};
    const nd=Object.assign({},data,{huidigeId:data.huidigeId+1});
    setData(nd);slaOp(nd);
    toonToast(checkLiveBadges(lp,car));
    setLp(function(p){return p.concat([b]);});
    setCar(0);setInp("0");setBeurtNr(function(n){return n+1;});setSel(new Set());setAndersGemist("");setAndersGoed("");setFase("invoer");
  }

  function sluit(){
    if(!lp.length){setConfPartij(false);return;}
    const st=stat(lp,huidigeDiscipline);
    const p=Object.assign({id:data.huidigeId,datum:new Date().toISOString(),tafel:tafel,doel:doel,doelType:doelType,discipline:huidigeDiscipline,beurten:lp},st);
    const nieuweAlleP=data.partijen.concat([p]).filter(function(x){return(x.discipline||"libre")===huidigeDiscipline;});
    const resultaten=berekenPrestaties(nieuweAlleP,tijdsvensterMaanden,huidigeDiscipline);
    const prestatie=resultaten.find(function(r){return r.id===p.id;});
    const infoVoor=berekenNiveauInfo(alleP);
    const infoNa=berekenNiveauInfo(nieuweAlleP);
    const nieuweDrop=infoNa.aantalDrops>infoVoor.aantalDrops?infoNa.gedroptePartijen[infoNa.gedroptePartijen.length-1]:null;
    const niveauVoor=bepaalNiveau(infoVoor.effectiefGemiddelde,huidigeDiscipline);
    const niveauNa=bepaalNiveau(infoNa.effectiefGemiddelde,huidigeDiscipline);
    const niveauOmhoog=niveauNa.index>niveauVoor.index?{van:niveauVoor.huidig,naar:niveauNa.huidig}:null;
    const nd=Object.assign({},data,{partijen:data.partijen.concat([p]),huidigeId:data.huidigeId+1,laatstGezienNiveauIndex:niveauNa.index});
    setData(nd);slaOp(nd);
    setPartijSamenvatting({partij:p,st:st,prestatie:prestatie,infoNa:infoNa,nieuweDrop:nieuweDrop,niveauOmhoog:niveauOmhoog});
    setLp([]);setBeurtNr(1);setCar(0);setInp("0");setSel(new Set());
    setConfPartij(false);setFase("setup");
  }

  function resetAlles(){
    const overigeDisciplines=data.partijen.filter(function(p){return(p.discipline||"libre")!==huidigeDiscipline;});
    const nd=Object.assign({},data,{partijen:overigeDisciplines});
    setData(nd);slaOp(nd);setLp([]);setBeurtNr(1);setCar(0);setInp("0");
    setSel(new Set());setFase("setup");
  }

  // Vervangt alle data in één keer (bijv. na importeren van een back-up) en slaat op
  function vervangData(nd){
    setData(nd);slaOp(nd);
  }

  function verwijderPartij(id){
    const nd=Object.assign({},data,{partijen:data.partijen.filter(function(p){return p.id!==id;})});
    setData(nd);slaOp(nd);
  }

  function slaNotitieOp(id,tekst){
    const nd=Object.assign({},data,{partijen:data.partijen.map(function(p){
      return p.id===id?Object.assign({},p,{notitie:tekst}):p;
    })});
    setData(nd);slaOp(nd);
  }

  function setTijdsvenster(v){
    const nd=Object.assign({},data,{tijdsvenster:v});
    setData(nd);slaOp(nd);
  }

  function wisselDiscipline(d){
    const nd=Object.assign({},data,{huidigeDiscipline:d});
    setData(nd);slaOp(nd);
  }

  function sluitOnboarding(){
    const nd=Object.assign({},data,{onboardingGezien:true});
    setData(nd);slaOp(nd);
  }

  function seizoenAfsluiten(){
    const huidigeSeizoenen=data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}];
    const nu=new Date().toISOString();
    const bijgewerkt=huidigeSeizoenen.map(function(s){
      return s.eindDatum===null?Object.assign({},s,{eindDatum:nu}):s;
    });
    const nieuwId=Math.max.apply(null,huidigeSeizoenen.map(function(s){return s.id;}))+1;
    bijgewerkt.push({id:nieuwId,naam:"Seizoen "+nieuwId,startDatum:nu,eindDatum:null});
    const nd=Object.assign({},data,{seizoenen:bijgewerkt});
    setData(nd);slaOp(nd);
  }

  function seizoensplitsingOngedaanMaken(){
    const huidigeSeizoenen=data.seizoenen||[{id:1,naam:"Seizoen 1",startDatum:null,eindDatum:null}];
    if(huidigeSeizoenen.length<2)return;
    const zonderLaatste=huidigeSeizoenen.slice(0,-1);
    const bijgewerkt=zonderLaatste.map(function(s,i){
      return i===zonderLaatste.length-1?Object.assign({},s,{eindDatum:null}):s;
    });
    const nd=Object.assign({},data,{seizoenen:bijgewerkt});
    setData(nd);slaOp(nd);
  }

  // ── SETUP ──
  function Setup(){
    return(
      <div style={{flex:1,display:"flex",flexDirection:"column",padding:"10px 14px",gap:7,overflowY:"auto"}}>
        <div style={{textAlign:"center",color:GOUD,fontSize:15,fontWeight:"bold"}}>Nieuwe partij</div>
        <NiveauKaart niveau={niveau} compact={true} discipline={huidigeDiscipline} onClick={function(){setNiveauOpen(true);}}/>
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:WITD,marginBottom:8}}>Tafelmaat</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {Object.keys(TAFELS).map(function(t){
              return(
                <button key={t} style={{padding:"9px 6px",background:tafel===t?"#2d4a1e":"none",border:"1px solid "+(tafel===t?GOUD:KBDR),borderRadius:8,color:tafel===t?GOUD:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:14}}
                  onClick={function(){setTafel(t);}}>{TAFELS[t].vol}</button>
              );
            })}
          </div>
        </div>
        <div style={{background:KBG,border:"1px solid "+KBDR,borderRadius:10,padding:"10px 14px"}}>
          <div style={{fontSize:13,textTransform:"uppercase",letterSpacing:2,color:WITD,marginBottom:6}}>Partij doel</div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <button style={{flex:1,padding:"8px 8px",background:doelType==="beurten"?"#2d4a1e":"none",border:"1px solid "+(doelType==="beurten"?GOUD:KBDR),borderRadius:8,color:doelType==="beurten"?GOUD:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:15}}
              onClick={function(){setDoelType("beurten");}}>Beurten</button>
            <button style={{flex:1,padding:"8px 8px",background:doelType==="caramboles"?"#2d4a1e":"none",border:"1px solid "+(doelType==="caramboles"?GOUD:KBDR),borderRadius:8,color:doelType==="caramboles"?GOUD:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:15}}
              onClick={function(){setDoelType("caramboles");}}>Caramboles</button>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:20,marginBottom:10}}>
            <button className="plusmin-btn" style={{width:38,height:38,borderRadius:"50%",background:"none",border:"2px solid "+GOUD,color:GOUD,fontSize:22,cursor:"pointer"}}
              onClick={function(){setDoel(function(n){return Math.max(5,n-5);});}}>-</button>
            <div style={{textAlign:"center",width:100}}>
              <div style={{fontSize:36,fontWeight:"bold",color:WIT,lineHeight:1}}>{doel}</div>
              <div style={{fontSize:13,color:WITD,marginTop:2}}>{doelType==="beurten"?"beurten":"caramboles"}</div>
            </div>
            <button className="plusmin-btn" style={{width:38,height:38,borderRadius:"50%",background:"none",border:"2px solid "+GOUD,color:GOUD,fontSize:22,cursor:"pointer"}}
              onClick={function(){setDoel(function(n){return n+5;});}}>+</button>
          </div>
          <div style={{display:"flex",gap:6}}>
            {(doelType==="beurten"?[15,20,25,30]:[50,75,100,150]).map(function(n){
              return <button key={n} style={{flex:1,padding:"7px 0",background:doel===n?"#2d4a1e":"none",border:"1px solid "+(doel===n?GOUD:KBDR),borderRadius:6,color:doel===n?GOUD:WITD,cursor:"pointer",fontFamily:"inherit",fontSize:14}}
                onClick={function(){setDoel(n);}}>{n}</button>;
            })}
          </div>
        </div>
        {lp.length>0&&(
          <div style={{background:"#1a2e10",border:"1px solid "+GOUD,borderRadius:10,padding:"10px 14px",fontSize:14,color:WITD}}>
            Lopende partij: {lp.length} beurten - {totCarLp} car - tafel {tafelLabel(tafel)}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{flex:1,padding:8,background:"none",border:"1px solid "+GOUD,borderRadius:6,color:GOUD,cursor:"pointer",fontFamily:"inherit",fontSize:14}}
                onClick={function(){setFase("invoer");}}>Doorgaan</button>
              <button style={{flex:1,padding:8,background:"#7a3030",border:"none",borderRadius:6,color:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:14}}
                onClick={function(){setConfPartij(true);}}>Afsluiten</button>
            </div>
          </div>
        )}
        <button style={{padding:18,background:"linear-gradient(135deg,"+GOUD+","+GOUDL+")",border:"none",borderRadius:12,color:G,fontSize:17,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit"}}
          onClick={function(){setLp([]);setBeurtNr(1);setCar(0);setInp("0");setSel(new Set());setFase("invoer");}}>
          Start partij
        </button>
      </div>
    );
  }

  // ── INVOER ──
  function Invoer(){
    const dInv=beurtDrempels(huidigeDiscipline);
    const s57=lp.filter(function(b){return b.caramboles>=dInv.opbouwMin&&b.caramboles<=dInv.opbouwMax;}).length;
    const s89=lp.filter(function(b){return b.caramboles>=dInv.sterkMin&&b.caramboles<=dInv.sterkMax;}).length;
    const s10=lp.filter(function(b){return b.caramboles>=dInv.topMin;}).length;
    const poedels=lp.filter(function(b){return b.caramboles===0;}).length;
    const poedelPct=lp.length>0?Math.round(poedels/lp.length*100):0;
    const opbouwPct=lp.length>0?Math.round((stL?stL.opbouw5:0)/lp.length*100):0;
    let partijPunten=0;
    if(lp.length>0){
      const virtuelePartij=Object.assign({id:-1,datum:new Date().toISOString(),tafel:tafel,discipline:huidigeDiscipline,beurten:lp},stat(lp,huidigeDiscipline));
      const resultaten=berekenPrestaties(alleP.concat([virtuelePartij]),tijdsvensterMaanden,huidigeDiscipline);
      const entry=resultaten.find(function(r){return r.id===-1;});
      partijPunten=entry?entry.punten:0;
    }
    return(
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{height:3,background:KBDR,flexShrink:0}}>
          <div style={{height:3,background:GOUD,width:progPct+"%",transition:"width 0.3s"}}/>
        </div>
        <div style={{padding:"10px 12px 6px",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#182e14",border:"1px solid "+GOUD,borderRadius:8,padding:"7px 10px",marginBottom:6}}>
            <span style={{fontSize:12,color:WITD}}>🎖️ Deze partij: <strong style={{color:GOUD}}>{partijPunten}pt</strong></span>
            <span style={{fontSize:12,color:WITD}}>Totaal: <strong style={{color:GOUD}}>{niveau.badgePunten+partijPunten}pt</strong></span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:6}}>
            {[["Gespeeld",lp.length,WIT],["Caramboles",stL?stL.totCar:0,GOUD],["Gem.",stL?stL.gemPerBeurt:"0.00",GOUDL],["Max",stL?stL.max:0,"#e8a84c"]].map(function(arr){
              return(
                <div key={arr[0]} style={{textAlign:"center",background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"7px 2px"}}>
                  <div style={{fontSize:20,fontWeight:"bold",color:arr[2],lineHeight:1}}>{arr[1]}</div>
                  <div style={{fontSize:11,color:WITD,marginTop:3,textTransform:"uppercase",letterSpacing:0.5}}>{arr[0]}</div>
                </div>
              );
            })}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:6}}>
            <div style={{background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"7px 6px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:"bold",color:GRNT,lineHeight:1}}>{stL?stL.opbouw5:0}x</div>
              <div style={{fontSize:11,color:WITD,marginTop:3,textTransform:"uppercase",letterSpacing:0.5}}>Opbouw 5+</div>
              <div style={{fontSize:13,color:GRNT,marginTop:1}}>{opbouwPct}%</div>
            </div>
            <div style={{background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"7px 6px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:"bold",color:poedels>0?"#e08055":WITD,lineHeight:1}}>{poedels}x</div>
              <div style={{fontSize:11,color:WITD,marginTop:3,textTransform:"uppercase",letterSpacing:0.5}}>Poedels</div>

          {(function(){
            let huidigeStreak=0;
            for(let i=lp.length-1;i>=0;i--){
              if(lp[i].caramboles>0)huidigeStreak++;
              else break;
            }
            const hints=[];
            if(huidigeStreak>0&&huidigeStreak<8){
              if(huidigeStreak<5)hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(5-huidigeStreak)+" tot 15pt)");
              else hints.push("⛓️ Reeks zonder poedel: "+huidigeStreak+" (nog "+(8-huidigeStreak)+" tot 25pt)");
            }
            if(lp.length>0&&lp[lp.length-1].caramboles===0){
              hints.push("💪 Volgende beurt "+dInv.opbouwMin+"+ car = sterk herstel (+15pt)");
            }
            if(stL){
              const gemNu=parseFloat(stL.gemPerBeurt);
              const basisNu=huidigeRecords.totaalGem!==null?huidigeRecords.totaalGem:0;
              const drempel1Nu=Math.floor(basisNu/0.5)*0.5+0.5;
              const drempel2Nu=drempel1Nu+0.5;
              if(gemNu<drempel2Nu){
                const drempel=gemNu<drempel1Nu?drempel1Nu:drempel2Nu;
                const afstand=drempel-gemNu;
                if(afstand<0.5)hints.push("⭐ Nog "+afstand.toFixed(2)+" tot gemiddelde "+drempel.toFixed(1).replace(".",","));
              }
              if(huidigeRecords.allTimeBestGem>0){
                const afstandRecord=huidigeRecords.allTimeBestGem-gemNu;
                if(afstandRecord>0&&afstandRecord<0.3)hints.push("👑 Nog "+afstandRecord.toFixed(2)+" tot je beste gemiddelde ooit ("+huidigeRecords.allTimeBestGem.toFixed(2)+")");
              }
              const tafelRecord=huidigeRecords.tafelBest[tafel];
              if(tafelRecord&&tafelRecord>0){
                const afstandTafel=tafelRecord-gemNu;
                if(afstandTafel>0&&afstandTafel<0.3)hints.push("🏓 Nog "+afstandTafel.toFixed(2)+" tot je tafelrecord ("+tafelRecord.toFixed(2)+")");
              }
              if(huidigeRecords.totaalGem!==null){
                const afstandTotaal=huidigeRecords.totaalGem-gemNu;
                if(afstandTotaal>0&&afstandTotaal<0.3)hints.push("📊 Nog "+afstandTotaal.toFixed(2)+" tot je totaalgemiddelde ("+huidigeRecords.totaalGem.toFixed(2)+")");
              }
              if(huidigeRecords.rolling5p!==null){
                const afstandRolling=huidigeRecords.rolling5p-gemNu;
                if(afstandRolling>0&&afstandRolling<0.3)hints.push("📉 Nog "+afstandRolling.toFixed(2)+" tot je 5-partij rolling gemiddelde ("+huidigeRecords.rolling5p.toFixed(2)+")");
              }
            }
            if(lp.length>=3){
              const poedelsNu=lp.filter(function(x){return x.caramboles===0;}).length;
              if(poedelsNu===0){
                hints.push("🛡️ Nog 0 poedels in "+lp.length+" beurten, blijf dit volhouden voor +30pt");
              }else{
                const poedelPctNu=poedelsNu/lp.length*100;
                if(poedelPctNu<20)hints.push("✅ "+Math.round(poedelPctNu)+"% poedels tot nu toe (drempel: <20%)");
              }
            }
            if(lp.length>0&&huidigeRecords.allTimeMaxBeurt>0){
              const maxInPartij=Math.max.apply(null,lp.map(function(x){return x.caramboles;}));
              const afstandMax=huidigeRecords.allTimeMaxBeurt-maxInPartij;
              if(afstandMax>0&&afstandMax<=3)hints.push("🏆 Hoogste beurt nu: "+maxInPartij+" car (record: "+huidigeRecords.allTimeMaxBeurt+" car)");
            }
            const helftNu=Math.floor(lp.length/2);
            if(helftNu>=3&&huidigeRecords.totaalGem!==null){
              const eersteNu=lp.slice(0,helftNu),tweedeNu=lp.slice(helftNu);
              const gemENu=eersteNu.reduce(function(a,b){return a+b.caramboles;},0)/eersteNu.length;
              const gemTNu=tweedeNu.reduce(function(a,b){return a+b.caramboles;},0)/tweedeNu.length;
              if(gemTNu>gemENu&&stL&&parseFloat(stL.gemPerBeurt)>huidigeRecords.totaalGem){
                hints.push("📈 Tot nu toe op koers voor sterke afsluiting: 1e helft "+gemENu.toFixed(2)+" · 2e helft "+gemTNu.toFixed(2)+" (schatting, kan nog veranderen)");
              }
            }
            if(doel&&doelType==="caramboles"){
              if(totCarLp<doel)hints.push("🎯 Nog "+(doel-totCarLp)+" caramboles tot je doel");
            }
            if(hints.length===0)return null;
            return(
              <div style={{background:"#182e14",border:"1px solid "+GOUD,borderRadius:8,padding:"7px 10px",marginBottom:6}}>
                {hints.map(function(h,i){return <div key={i} style={{fontSize:13,color:WITD,padding:"2px 0"}}>{h}</div>;})}
              </div>
            );
          })()}
          {lp.length>1&&(
            <div style={{background:"#182e14",border:"1px solid "+KBDR,borderRadius:8,padding:"6px 8px"}}>
              <Grafiek beurten={lp}/>
            </div>
          )}
        </div>
      </div>
    );
  }

      </div>
      {kaderKiezerOpen&&(
        <div onClick={function(){setKaderKiezerOpen(false);}} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"pointer"}}>
          <div onClick={function(e){e.stopPropagation();}} style={{background:"linear-gradient(160deg,#1e3a1e,#0d1f0d)",border:"2px solid "+GOUD,borderRadius:16,padding:"18px 16px",maxWidth:340,width:"100%"}}>
            <div style={{fontSize:16,fontWeight:"bold",color:GOUD,marginBottom:4,textAlign:"center"}}>Kies je kader-variant</div>
            <div style={{fontSize:12,color:WITD,textAlign:"center",marginBottom:14}}>Elke variant heeft zijn eigen gemiddelde en niveau, los van de andere</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {KADER_VARIANTEN.map(function(k){
                const actief=huidigeDiscipline===k;
                return(
                  <button key={k} onClick={function(){wisselDiscipline(k);setKaderKiezerOpen(false);}}
                    style={{padding:"12px 10px",background:actief?"#2d4a1e":"none",border:"1px solid "+(actief?GOUD:KBDR),borderRadius:10,color:actief?GOUD:WIT,cursor:"pointer",fontFamily:"inherit",fontSize:15,textAlign:"left"}}>
                    {DISCIPLINES[k].naam}
                  </button>
                );
              })}
            </div>
            <div onClick={function(){setKaderKiezerOpen(false);}} style={{textAlign:"center",marginTop:14,fontSize:12,color:WITD,opacity:0.7,cursor:"pointer"}}>Tik om te sluiten</div>
          </div>
        </div>
      )}

      <div style={{display:"flex",borderBottom:"1px solid "+KBDR,background:"#152015",flexShrink:0}}>
        {[["spelen","Spelen"],["stats","Stats"],["dash","Dash"],["log","Log"],["data","Data"]].map(function(arr){
          return <button key={arr[0]} style={{flex:1,padding:"11px 0",background:tab===arr[0]?"#1c2c1c":"none",border:"none",color:tab===arr[0]?GOUD:WITD,fontSize:14,cursor:"pointer",fontFamily:"inherit",borderBottom:tab===arr[0]?"2px solid "+GOUD:"2px solid transparent"}}
            onClick={function(){setTab(arr[0]);}}>{arr[1]}</button>;
        })}
      </div>

      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {tab==="spelen"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {/* Deze schermen staan binnen BiljartTracker en worden daarom als gewone functie aangeroepen,
                niet als <Component/>: anders ziet React ze bij elke render als nieuw component, verliest een
                invoerveld na elke letter de focus en springt de scrollpositie terug. Geen hooks in deze functies. */}
            {fase==="setup"&&Setup()}
            {fase==="invoer"&&Invoer()}
            {fase==="gemist"&&Gemist()}
            {fase==="goed"&&Goed()}
          </div>
        )}
        {tab==="stats"&&<StatsTab data={data} alleP={alleP} huidigeDiscipline={huidigeDiscipline} niveau={niveau}
          huidigeRecords={huidigeRecords} prestatiesMap={prestatiesMap} tijdsvenster={tijdsvenster} setTijdsvenster={setTijdsvenster}
          seizoenAfsluiten={seizoenAfsluiten} seizoensplitsingOngedaanMaken={seizoensplitsingOngedaanMaken}
          openArchief={function(){setSeizoenArchiefOpen(true);}} verwijderPartij={verwijderPartij} slaNotitieOp={slaNotitieOp} resetAlles={resetAlles}/>}
        {tab==="data"&&<DataTab data={data} alleP={alleP} huidigeDiscipline={huidigeDiscipline} vervangData={vervangData}/>}
        {tab==="log"&&<LogTab lp={lp} alleP={alleP} prestatiesMap={prestatiesMap} niveau={niveau} huidigeDiscipline={huidigeDiscipline} verwijderPartij={verwijderPartij} slaNotitieOp={slaNotitieOp}/>}
        {tab==="dash"&&<Dashboard partijen={alleP} niveau={niveau} tijdsvensterMaanden={tijdsvensterMaanden} discipline={huidigeDiscipline}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BiljartTracker,null));
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
